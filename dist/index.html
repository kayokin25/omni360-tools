document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x 18px;background:{{ cChipBg }};border-bottom:1px solid {{ cLine }}\">\n        <div style=\"font-size:14px;font-weight:600;color:{{ cText }}\">Гайд · {{ guideTool.name }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeGuide }}\" style=\"background:{{ cBtnBg }};border:1px solid {{ cBtnLine }};color:{{ cMuted }};width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1\" style-hover=\"color:var(--om-text);border-color:var(--om-accent)\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <iframe src=\"{{ guideSrc }}\" style=\"flex:1;border:none;background:{{ cBg }}\"><\u002Fiframe>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:900},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;comfortable&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Вид&quot;},&quot;accentFrom&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#00c6ff&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Акцент&quot;,&quot;options&quot;:[&quot;#00c6ff&quot;,&quot;#4f8cff&quot;,&quot;#a78bfa&quot;,&quot;#22c55e&quot;]},&quot;accentTo&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7bed9f&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Акцент&quot;,&quot;options&quot;:[&quot;#7bed9f&quot;,&quot;#22c55e&quot;,&quot;#f59e0b&quot;,&quot;#00c6ff&quot;]}}\">\nconst TOOLS = [\n  { id:'map', name:'Карта-компаньон', desc:'Проверка инвентаря по картам и адресам', type:'internal', get src(){ return window.__resources ? window.__resources.mapTool : 'map-companion.html'; }, letter:'К' },\n  { id:'omnibuy', name:'OmniBuy — калькулятор надбавки', desc:'Расчёт надбавки и разбивка заработка по СК', type:'internal', get src(){ return window.__resources ? window.__resources.omnibuyTool : 'omnibuy-calculator.html'; }, letter:'O' },\n  { id:'techreq', name:'Сбор технических требований', desc:'Длительности роликов и ссылки на ТТ по адресной программе', type:'internal', get src(){ return window.__resources ? window.__resources.techreqTool : 'techreq.html'; }, letter:'Т' },\n  { id:'creatives', name:'Сортировка креативов', desc:'Выделение нужных крео из общего архива по адресной программе', type:'internal', get src(){ return window.__resources ? window.__resources.creativesTool : 'creatives.html'; }, letter:'С' },\n  { id:'addresses', name:'Подбор адресов', desc:'Подбор POI через 2ГИС по запросу и городу', type:'internal', get src(){ return window.__resources ? window.__resources.addressesTool : 'addresses.html'; }, letter:'А' },\n  { id:'merge', name:'Объединение таблиц', desc:'Несколько xlsx в один файл без ручной правки', type:'internal', get src(){ return window.__resources ? window.__resources.mergeTool : 'merge.html'; }, letter:'Σ' },\n  { id:'azimuth', name:'Добавление азимутов', desc:'Столбец «Азимут» в эфирки по инвентарю, без пересборки файла', type:'internal', get src(){ return window.__resources ? window.__resources.azimuthTool : 'azimuth.html'; }, letter:'∠' },\n  { id:'reports', name:'Подготовка отчётности', desc:'Инвенто, MasterAd и другие форматы — несколько сценариев в одном инструменте', type:'internal', get src(){ return window.__resources ? window.__resources.reportsTool : 'reports.html'; }, letter:'Р' },\n  { id:'monitoring', name:'Мониторинг кампаний', desc:'Статусы и показатели активных кампаний', type:'external', url:'https://leafy-salmiakki-19a465.netlify.app/', letter:'М' },\n  { id:'planner', name:'Планировщик', desc:'Планирование размещений и медиапланов', type:'external', url:'https://omni360.adtech.systems/page103658706.html', letter:'П' }\n];\n\n/* Палитры. Тёмная — как было; светлая подобрана под тот же акцент.\n   Для градиентного текста в светлой теме нужны более тёмные оттенки:\n   #7bed9f на белом читается плохо. */\nconst THEMES = {\n  dark: {\n    cBg:'#0a0e1a', cText:'#f1f5f9', cCard:'#111827', cLine:'#1e293b',\n    cMuted:'#64748b', cDim:'#475569', cDesc:'#94a3b8', cChipBg:'#0f172a',\n    cFooter:'#334155', cOverlay:'rgba(4,6,12,.72)', cShadow:'0 24px 80px rgba(0,0,0,.6)',\n    cBtnBg:'#1e293b', cBtnLine:'#334155',\n    cAccentTextFrom:'#00c6ff', cAccentTextTo:'#7bed9f',\n    cExtCard:'#0e1421', cExtLine:'#2a3550', cExtAccent:'#a78bfa',\n    cExtChipBg:'#1a1533', cExtChipLine:'#3b2f6b', cExtChipText:'#c4b5fd',\n    cExtIconBg:'linear-gradient(135deg,#312e5f,#1f2544)', cExtIconText:'#ddd6fe',\n    cExtLink:'#a78bfa'\n  },\n  light: {\n    cBg:'#eef2f7', cText:'#0f172a', cCard:'#ffffff', cLine:'#dbe3ec',\n    cMuted:'#64748b', cDim:'#94a3b8', cDesc:'#475569', cChipBg:'#f6f8fb',\n    cFooter:'#94a3b8', cOverlay:'rgba(15,23,42,.42)', cShadow:'0 24px 80px rgba(15,23,42,.18)',\n    cBtnBg:'#f1f5f9', cBtnLine:'#dbe3ec',\n    cAccentTextFrom:'#0284c7', cAccentTextTo:'#15803d',\n    cExtCard:'#faf7ff', cExtLine:'#d9cdf5', cExtAccent:'#7c3aed',\n    cExtChipBg:'#f3ecff', cExtChipLine:'#ddd0fb', cExtChipText:'#6d28d9',\n    cExtIconBg:'linear-gradient(135deg,#ede9fe,#e0e7ff)', cExtIconText:'#4c1d95',\n    cExtLink:'#6d28d9'\n  }\n};\n\nconst THEME_KEY = 'omni360.theme';\nconst ORDER_KEY = 'omni360.toolOrder';\nconst SEEN_KEY = 'omni360.guideSeen';\n\n/* Прочитанные гайды хранит панель, а не сам гайд: у панели один localStorage\n   на всё, а документ с blob:-адресом до него дотягивается не в любом браузере. */\nfunction readSeen() {\n  try {\n    const raw = localStorage.getItem(SEEN_KEY);\n    if (!raw) return {};\n    const v = JSON.parse(raw);\n    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};\n  } catch (e) { return {}; }\n}\n\nfunction saveSeen(map) {\n  try { localStorage.setItem(SEEN_KEY, JSON.stringify(map)); } catch (e) { /* не критично */ }\n}\n\nfunction readOrder() {\n  try {\n    const raw = localStorage.getItem(ORDER_KEY);\n    if (!raw) return null;\n    const ids = JSON.parse(raw);\n    return Array.isArray(ids) && ids.every(function (x) { return typeof x === 'string'; })\n      ? ids : null;\n  } catch (e) { return null; }   // приватный режим или мусор\n}\n\nfunction saveOrder(ids) {\n  try {\n    if (ids) localStorage.setItem(ORDER_KEY, JSON.stringify(ids));\n    else localStorage.removeItem(ORDER_KEY);\n  } catch (e) { /* не критично */ }\n}\n\n/* Сохранённый порядок + новые инструменты в конец. Так добавление инструмента\n   не ломает уже настроенную пользователем очередность. */\nfunction applyOrder(tools, ids) {\n  if (!ids) return tools.slice();\n  const byId = new Map(tools.map(function (t) { return [t.id, t]; }));\n  const out = [];\n  for (const id of ids) {\n    const t = byId.get(id);\n    if (t) { out.push(t); byId.delete(id); }\n  }\n  for (const t of tools) if (byId.has(t.id)) out.push(t);\n  return out;\n}\n\n/* Ссылка на компонент для делегированных обработчиков перетаскивания.\n   События ловим на document, потому что карточки пересоздаются при\n   каждой перерисовке — навешивать на них по отдельности бессмысленно. */\nlet panelApi = null;\n\n(function initDragAndDrop() {\n  let dragId = null, dragGroup = null, dragEl = null;\n\n  function cardOf(node) {\n    return node && node.closest ? node.closest('[data-tool]') : null;\n  }\n  function clearMarks() {\n    for (const el of document.querySelectorAll('[data-tool]')) {\n      el.style.outline = '';\n      el.style.outlineOffset = '';\n      el.style.opacity = '';\n    }\n  }\n\n  document.addEventListener('dragstart', function (e) {\n    const el = cardOf(e.target);\n    if (!el) return;\n    dragId = el.getAttribute('data-tool');\n    dragGroup = el.getAttribute('data-group');\n    dragEl = el;\n    try {\n      e.dataTransfer.effectAllowed = 'move';\n      e.dataTransfer.setData('text/plain', dragId);\n    } catch (err) { /* некоторые браузеры капризничают */ }\n    el.style.opacity = '.4';\n  });\n\n  document.addEventListener('dragover', function (e) {\n    if (!dragId) return;\n    const el = cardOf(e.target);\n    if (!el || el.getAttribute('data-group') !== dragGroup) return;\n    e.preventDefault();\n    try { e.dataTransfer.dropEffect = 'move'; } catch (err) { /* ok */ }\n    if (el !== dragEl) {\n      el.style.outline = '2px dashed var(--om-accent)';\n      el.style.outlineOffset = '3px';\n    }\n  });\n\n  document.addEventListener('dragleave', function (e) {\n    const el = cardOf(e.target);\n    if (el && el !== dragEl) { el.style.outline = ''; el.style.outlineOffset = ''; }\n  });\n\n  document.addEventListener('drop', function (e) {\n    if (!dragId) return;\n    const el = cardOf(e.target);\n    const from = dragId, group = dragGroup;\n    clearMarks();\n    dragId = dragGroup = dragEl = null;\n    if (!el || el.getAttribute('data-group') !== group) return;\n    e.preventDefault();\n    const to = el.getAttribute('data-tool');\n    if (to && to !== from && panelApi) panelApi.moveTool(from, to);\n  });\n\n  document.addEventListener('dragend', function () {\n    clearMarks();\n    dragId = dragGroup = dragEl = null;\n  });\n})();\n\n/* Гайд живёт в iframe и просит панель что-то сделать: открыть инструмент,\n   закрыться, отметиться прочитанным. Данных в сообщении нет — только действие\n   и id инструмента, который всё равно ищется в TOOLS, так что «чужой» id\n   ничего не откроет. */\nwindow.addEventListener('message', function (e) {\n  const d = e.data;\n  if (!d || typeof d !== 'object' || !d.omniGuide || !panelApi) return;\n  const g = d.omniGuide;\n  if (g.action === 'seen' && typeof g.tool === 'string') panelApi.markGuideSeen(g.tool);\n  else if (g.action === 'close') panelApi.closeGuide();\n  else if (g.action === 'open' && typeof g.tool === 'string') panelApi.openFromGuide(g.tool, !!g.demo);\n});\n\nclass Component extends DCLogic {\n  state = { pinned: {}, activeToolId: null, activeToolDemo: false, guideToolId: null,\n            theme: readTheme(), order: readOrder(), seenGuides: readSeen() };\n\n  toggleFavorite = (id) => {\n    this.setState(s => ({ pinned: { ...s.pinned, [id]: !s.pinned[id] } }));\n  };\n\n  toggleTheme = () => {\n    this.setState(s => {\n      const theme = s.theme === 'dark' ? 'light' : 'dark';\n      try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* приватный режим */ }\n      applyThemeAttr(theme);\n      // открытому инструменту сообщаем смену темы, чтобы он не перезагружался\n      // и не терял результаты\n      for (const f of document.querySelectorAll('iframe')) {\n        try { f.contentWindow.postMessage({ omniTheme: theme }, '*'); } catch (e) { /* нет доступа */ }\n      }\n      return { theme };\n    });\n  };\n\n  /* Переставить инструмент на место другого. Оба всегда из одной секции —\n     это проверяет обработчик drop. */\n  moveTool = (fromId, toId) => {\n    this.setState(s => {\n      const ids = applyOrder(TOOLS, s.order).map(t => t.id);\n      const from = ids.indexOf(fromId);\n      const to = ids.indexOf(toId);\n      if (from < 0 || to < 0 || from === to) return {};\n      ids.splice(to, 0, ids.splice(from, 1)[0]);\n      saveOrder(ids);\n      return { order: ids };\n    });\n  };\n\n  resetOrder = () => {\n    saveOrder(null);\n    this.setState({ order: null });\n  };\n\n  openTool = (tool) => {\n    if (tool.type === 'internal') {\n      this.setState({ activeToolId: tool.id, activeToolDemo: false });\n    } else {\n      window.open(tool.url, '_blank', 'noopener');\n    }\n  };\n\n  openGuide = (tool) => this.setState({ guideToolId: tool.id });\n  closeGuide = () => this.setState({ guideToolId: null });\n  closeGuideBackdrop = () => this.closeGuide();\n\n  /* Гайд открытого инструмента — из шапки модалки. Инструмент не закрываем:\n     модалка гайда ложится сверху, и по ✕ пользователь вернётся к работе. */\n  openGuideForActive = () => {\n    if (this.state.activeToolId) this.setState({ guideToolId: this.state.activeToolId });\n  };\n\n  markGuideSeen = (id) => {\n    this.setState(s => {\n      if (s.seenGuides[id]) return {};\n      const seen = { ...s.seenGuides, [id]: 1 };\n      saveSeen(seen);\n      return { seenGuides: seen };\n    });\n  };\n\n  /* «Открыть инструмент» из гайда. demo — открыть сразу с демо-данными:\n     инструмент читает это из #demo=1 в своём адресе. */\n  openFromGuide = (id, demo) => {\n    const tool = TOOLS.find(t => t.id === id);\n    if (!tool) return;\n    if (tool.type === 'internal') {\n      this.setState({ guideToolId: null, activeToolId: tool.id, activeToolDemo: !!demo });\n    } else {\n      window.open(tool.url, '_blank', 'noopener');\n      this.setState({ guideToolId: null });\n    }\n  };\n\n  closeModal = () => this.setState({ activeToolId: null, activeToolDemo: false });\n  closeModalBackdrop = () => this.closeModal();\n  stopProp = (e) => e.stopPropagation();\n\n  renderVals() {\n    const density = this.props.density ?? 'comfortable';\n    const compact = density === 'compact';\n    const accentFrom = this.props.accentFrom ?? '#00c6ff';\n    const accentTo = this.props.accentTo ?? '#7bed9f';\n    const pinned = this.state.pinned;\n    const seenGuides = this.state.seenGuides;\n    const theme = this.state.theme === 'light' ? 'light' : 'dark';\n    const c = THEMES[theme];\n\n    const decorate = (t) => {\n      const isPinned = !!pinned[t.id];\n      const ext = t.type === 'external';\n      return { ...t, isPinned,\n        starChar: isPinned ? '★' : '☆',\n        starColor: isPinned ? '#f59e0b' : c.cDim,\n        typeLabel: ext ? 'Внешний' : 'Внутренний',\n        openLabel: ext ? 'Открыть ↗' : 'Открыть →',\n        cardBg: ext ? c.cExtCard : c.cCard,\n        borderColor: ext ? c.cExtLine : c.cLine,\n        borderStyle: ext ? 'dashed' : 'solid',\n        iconBg: ext ? c.cExtIconBg : `linear-gradient(135deg,${accentFrom},${accentTo})`,\n        chipBg: ext ? c.cExtChipBg : c.cChipBg,\n        chipLine: ext ? c.cExtChipLine : c.cLine,\n        chipText: ext ? c.cExtChipText : c.cMuted,\n        linkColor: ext ? c.cExtLink : accentFrom,\n        guideSeen: !!seenGuides[t.id],\n        // Точка у непрочитанного гайда: без неё кнопка сливается с интерфейсом\n        // и её просто не замечают.\n        guideLabel: seenGuides[t.id] ? 'Гайд' : 'Гайд •',\n        guideColor: seenGuides[t.id] ? c.cMuted : (ext ? c.cExtLink : accentFrom),\n        guideLine: seenGuides[t.id] ? c.cLine : (ext ? c.cExtChipLine : c.cLine),\n        guideTitle: seenGuides[t.id] ? 'Как это работает' : 'Гайд ещё не открывали',\n        handleOpen: () => this.openTool(t),\n        handleGuide: (e) => { e.stopPropagation(); this.openGuide(t); },\n        handleTogglePin: (e) => { e.stopPropagation(); this.toggleFavorite(t.id); }\n      };\n    };\n\n    panelApi = this;   // делегированным обработчикам нужен доступ к setState\n\n    const ordered = applyOrder(TOOLS, this.state.order);\n    const allTools = ordered.map(decorate);\n    const activeTool = this.state.activeToolId\n      ? TOOLS.find(t => t.id === this.state.activeToolId)\n      : null;\n\n    // Тему передаём инструменту через #hash: он применит её сразу, без мигания\n    let activeToolSrc = '';\n    if (activeTool && activeTool.src) {\n      activeToolSrc = activeTool.src + '#theme=' + theme +\n        (this.state.activeToolDemo ? '&demo=1' : '');\n    }\n\n    const guideTool = this.state.guideToolId\n      ? TOOLS.find(t => t.id === this.state.guideToolId)\n      : null;\n    let guideSrc = '';\n    if (guideTool) {\n      const base = window.__resources ? window.__resources.guideTool : 'guide.html';\n      guideSrc = base + '#tool=' + guideTool.id + '&theme=' + theme;\n    }\n\n    return {\n      allTools,\n      internalTools: allTools.filter(t => t.type === 'internal'),\n      externalTools: allTools.filter(t => t.type === 'external'),\n      pinnedTools: allTools.filter(t => t.isPinned),\n      hasPinned: allTools.some(t => t.isPinned),\n      activeTool,\n      activeToolSrc,\n      guideTool,\n      guideSrc,\n      activeToolNoteVisible: !!(activeTool && !activeTool.src),\n      accentFrom,\n      accentTo,\n      hasCustomOrder: !!this.state.order,\n      orderHint: 'карточки можно перетаскивать',\n      resetOrder: this.resetOrder,\n      moveTool: this.moveTool,\n      themeIcon: theme === 'dark' ? '☀' : '☾',\n      themeLabel: theme === 'dark' ? 'Светлая' : 'Тёмная',\n      themeTitle: theme === 'dark' ? 'Переключить на светлую тему' : 'Переключить на тёмную тему',\n      ...c,\n      cardGap: compact ? '12px' : '20px',\n      cardPadding: compact ? '14px' : '20px',\n      sectionGap: compact ? '24px' : '36px',\n      toggleFavorite: this.toggleFavorite,\n      toggleTheme: this.toggleTheme,\n      openTool: this.openTool,\n      closeModal: this.closeModal,\n      closeModalBackdrop: this.closeModalBackdrop,\n      openGuide: this.openGuide,\n      openGuideForActive: this.openGuideForActive,\n      closeGuide: this.closeGuide,\n      closeGuideBackdrop: this.closeGuideBackdrop,\n      stopProp: this.stopProp\n    };\n  }\n}\n\nfunction readTheme() {\n  try {\n    const saved = localStorage.getItem(THEME_KEY);\n    if (saved === 'light' || saved === 'dark') return saved;\n  } catch (e) { /* приватный режим */ }\n  try {\n    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';\n  } catch (e) { /* нет matchMedia */ }\n  return 'dark';\n}\n\n/* Атрибут на <html> нужен CSS-переменным из helmet: через них заданы цвета\n   :hover, куда интерполяция {{ }} не доходит. */\nfunction applyThemeAttr(theme) {\n  try {\n    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');\n  } catch (e) { /* документа ещё нет */ }\n}\n\napplyThemeAttr(readTheme());\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>\n"
  </script>
