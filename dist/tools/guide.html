    const rAttr = /\br="(\d+)"/.exec(attrs);
    const num = rAttr ? parseInt(rAttr[1], 10) : (rows.length + 1);
    const openTagEnd = m.index + 4 + attrs.length + (selfClosing ? 2 : 1);
    rows.push({
      num: num,
      start: m.index,
      end: m.index + m[0].length,
      attrs: attrs,
      selfClosing: selfClosing,
      inner: inner,
      innerStart: openTagEnd,               // абсолютное начало тела строки
      innerEnd: openTagEnd + inner.length,   // абсолютный конец тела (перед </row>)
      cells: parseCells(inner, openTagEnd)
    });
  }
  return rows;
}

function parseCells(inner, base) {
  const cells = [];
  const re = new RegExp(CELL_RE);
  let m, autoCol = 0;
  while ((m = re.exec(inner))) {
    const attrs = m[1] || '';
    const selfClosing = m[2] === '/>';
    const body = selfClosing ? '' : (m[3] || '');
    const refM = /\br="([A-Za-z]+\d+)"/.exec(attrs);
    const col = refM ? L.colToIndex(refM[1]) : autoCol;
    autoCol = col + 1;
    cells.push({
      col: col,
      start: base + m.index,
      end: base + m.index + m[0].length,
      attrs: attrs,
      selfClosing: selfClosing,
      body: body
    });
  }
  return cells;
}

/* Значение ячейки как строка/число — тот же порядок типов, что в
   OmniLib.parseSheetXml (inlineStr → shared → str/e/b → число). */
function cellValue(cell, shared) {
  if (!cell) return null;
  const tM = /\bt="([^"]+)"/.exec(cell.attrs);
  const type = tM ? tM[1] : 'n';
  if (type === 'inlineStr') {
    let text = '';
    const tRe = /<t\b[^>]*>([\s\S]*?)<\/t>|<t\b[^>]*\/>/g;
    let t;
    while ((t = tRe.exec(cell.body))) text += L.unescapeXml(t[1] || '');
    return text;
  }
  const vM = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(cell.body);
  const raw = vM ? L.unescapeXml(vM[1]) : null;
  if (raw === null || raw === '') return null;
  if (type === 's') return (shared && shared[parseInt(raw, 10)]) !== undefined ? shared[parseInt(raw, 10)] : null;
  if (type === 'str' || type === 'e') return raw;
  if (type === 'b') return raw === '1';
  const num = Number(raw);
  return isNaN(num) ? raw : num;
}

function cellInRow(row, col) {
  for (const c of row.cells) if (c.col === col) return c;
  return null;
}

function styleAttrOf(cell) {
  if (!cell) return '';
  const sM = /\bs="(\d+)"/.exec(cell.attrs);
  return sM ? sM[0] : '';   // 's="N"' целиком либо '' (стиль по умолчанию)
}

/* Ищет ячейку с текстом targetName (без учёта регистра) в первых maxRows
   строках — как find_header_cell в add_azimuth.py. */
function findHeaderCell(rows, targetName, maxRows, shared) {
  const target = targetName.trim().toLowerCase();
  for (const row of rows) {
    if (row.num > maxRows) continue;
    for (const cell of row.cells) {
      const v = cellValue(cell, shared);
      if (v !== null && String(v).trim().toLowerCase() === target) {
        return { row: row.num, col: cell.col };
      }
    }
  }
  return null;
}

/* Границы шапки для данного столбца по <mergeCells> — как
   get_header_row_span в add_azimuth.py. */
function mergeSpan(xml, headerRow, col) {
  const mcM = /<mergeCells\b[^>]*>([\s\S]*?)<\/mergeCells>/.exec(xml);
  if (mcM) {
    const re = /<mergeCell\b[^>]*ref="([A-Za-z]+)(\d+):([A-Za-z]+)(\d+)"/g;
    let m;
    while ((m = re.exec(mcM[1]))) {
      const c1 = L.colToIndex(m[1]), r1 = parseInt(m[2], 10);
      const c2 = L.colToIndex(m[3]), r2 = parseInt(m[4], 10);
      const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
      const minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
      if (minR <= headerRow && headerRow <= maxR && minC <= col && col <= maxC) {
        return { start: minR, end: maxR };
      }
    }
  }
  return { start: headerRow, end: headerRow };
}

/* Строка, с которой начинаются данные, — ИСПРАВЛЕННАЯ версия эвристики из
   add_azimuth.py (см. там же и в README про сам баг). Раньше признаком
   «здесь подзаголовок, а не данные» считалось «в строке есть хоть что-то» —
   а у настоящей строки данных есть всегда, поэтому для файлов с
   одностроч­ной (не объединённой) шапкой первая строка данных пропускалась
   молча. Правильный признак — пустая именно ячейка GID: у данных она есть
   всегда, у строки-подзаголовка (напр. дата в «Статистика по дням») — нет. */
function detectDataStart(rowByNum, maxRow, headerEnd, gidCol, shared) {
  const rowAfter = headerEnd + 1;
  if (rowAfter > maxRow) return rowAfter;
  const row = rowByNum.get(rowAfter);
  if (!row) return rowAfter;
  const gidCell = cellInRow(row, gidCol);
  const gidVal = cellValue(gidCell, shared);
  const gidEmpty = gidVal === null || String(gidVal).trim() === '';
  if (!gidEmpty) return rowAfter;
  const hasOther = row.cells.some(function (c) {
    if (c.col === gidCol) return false;
    const v = cellValue(c, shared);
    return v !== null && String(v).trim() !== '';
  });
  return hasOther ? rowAfter + 1 : rowAfter;
}

function maxColumnUsed(rows) {
  let max = -1;
  for (const row of rows) for (const c of row.cells) if (c.col > max) max = c.col;
  return max;
}

function maxRowUsed(rows) {
  let max = 0;
  for (const row of rows) if (row.num > max) max = row.num;
  return max;
}

/* ───────────────────────── сборка новой ячейки ──────────────────────────── */

function buildCell(colIdx, rowNum, styleAttr, value) {
  const ref = L.indexToCol(colIdx) + rowNum;
  if (value === null || value === undefined || value === '') {
    return '<c r="' + ref + '"' + (styleAttr ? ' ' + styleAttr : '') + ' t="n"></c>';
  }
  if (typeof value === 'number' && isFinite(value)) {
    return '<c r="' + ref + '"' + (styleAttr ? ' ' + styleAttr : '') + ' t="n"><v>' + value + '</v></c>';
  }
  // Текст всегда как inlineStr: не трогаем sharedStrings.xml, а смешивать
  // inlineStr с shared-строками в одном листе — валидный OOXML.
  return '<c r="' + ref + '"' + (styleAttr ? ' ' + styleAttr : '') +
    ' t="inlineStr"><is><t xml:space="preserve">' + L.escapeXml(String(value)) + '</t></is></c>';
}

/* Правка одной строки: заменить существующую ячейку столбца targetCol,
   вставить новую в конец, либо (если строки вообще не было в этом
   диапазоне) вставить целую новую <row>. Возвращает {start, end, text} —
   заготовку для applyEdits. rowByNum/sortedNums — для случая «строки нет». */
function planRowEdit(xml, rowByNum, sortedNums, rowNum, targetCol, styleAttr, value) {
  const row = rowByNum.get(rowNum);
  const cellXml = buildCell(targetCol, rowNum, styleAttr, value);

  if (!row) {
    // Такой строки в листе нет вовсе (полностью пустая, «дырка» в разметке).
    // Вставляем новую <row> перед первой строкой с большим номером —
    // либо перед </sheetData>, если это последняя строка листа.
    let insertAt = -1;
    for (const n of sortedNums) {
      if (n > rowNum) { insertAt = rowByNum.get(n).start; break; }
    }
    if (insertAt < 0) {
      const sd = /<\/sheetData>/.exec(xml);
      insertAt = sd ? sd.index : xml.length;
    }
    return { start: insertAt, end: insertAt, text: '<row r="' + rowNum + '">' + cellXml + '</row>' };
  }

  const existing = cellInRow(row, targetCol);
  if (existing) {
    return { start: existing.start, end: existing.end, text: cellXml };
  }
  if (row.selfClosing) {
    return { start: row.start, end: row.end, text: '<row' + row.attrs + '>' + cellXml + '</row>' };
  }
  // Вставляем в конец детей строки. Целевой столбец у нас почти всегда
  // последний (max+1), так что позиция и без сортировки будет верной; если
  // когда-то он окажется не последним — ячейка всё равно попадёт в строку,
  // просто не по возрастанию номеров колонок (Excel порядок <c> внутри
  // <row> не требует, читает по r=).
  return { start: row.innerEnd, end: row.innerEnd, text: cellXml };
}

/* Обновляет spans="a:b" строки, если новый столбец вышел за старую границу. */
function planSpansEdit(row, targetCol) {
  const m = /\bspans="(\d+):(\d+)"/.exec(row.attrs);
  if (!m) return null;
  const lo = parseInt(m[1], 10), hi = parseInt(m[2], 10);
  const need = targetCol + 1;
  if (need <= hi) return null;
  const attrStart = row.start + 4 + row.attrs.indexOf(m[0]);
  return { start: attrStart, end: attrStart + m[0].length, text: 'spans="' + lo + ':' + need + '"' };
}

/* ───────────────────────── дополнительные штрихи ────────────────────────── */

/* Ширина столбца GID → тот же width для нового столбца (только когда столбец
   создаётся, а не переиспользуется существующий). */
function planColWidth(xml, gidCol, targetCol) {
  const colsM = /<cols>([\s\S]*?)<\/cols>/.exec(xml);
  if (!colsM) return null;
  const re = /<col\b([^>]*)\/>/g;
  let m, width = null;
  while ((m = re.exec(colsM[1]))) {
    const minM = /\bmin="(\d+)"/.exec(m[1]);
    const maxM = /\bmax="(\d+)"/.exec(m[1]);
    if (!minM || !maxM) continue;
    const lo = parseInt(minM[1], 10) - 1, hi = parseInt(maxM[1], 10) - 1;   // 1-based → 0-based
    if (lo <= gidCol && gidCol <= hi) {
      const wM = /\bwidth="([\d.]+)"/.exec(m[1]);
      if (wM) width = wM[1];
      break;
    }
  }
  if (width === null) return null;
  const insertAt = xml.indexOf('</cols>', colsM.index);
  const colTag = '<col min="' + (targetCol + 1) + '" max="' + (targetCol + 1) +
    '" width="' + width + '" customWidth="1"/>';
  return { start: insertAt, end: insertAt, text: colTag };
}

/* <mergeCells> для нового столбца — только когда шапка объединена НЕ в одну
   строку и столбец создаётся впервые. */
function planMerge(xml, headerStart, headerEnd, targetCol) {
  if (headerEnd <= headerStart) return null;
  const ref = L.indexToCol(targetCol) + headerStart + ':' + L.indexToCol(targetCol) + headerEnd;
  const mcM = /<mergeCells\b([^>]*)count="(\d+)"([^>]*)>([\s\S]*?)<\/mergeCells>/.exec(xml);
  if (mcM) {
    const newCount = parseInt(mcM[2], 10) + 1;
    const insertAt = mcM.index + mcM[0].length - '</mergeCells>'.length;
    return [
      { start: mcM.index, end: mcM.index + mcM[0].indexOf('>') + 1,
        text: '<mergeCells' + mcM[1] + 'count="' + newCount + '"' + mcM[3] + '>' },
      { start: insertAt, end: insertAt, text: '<mergeCell ref="' + ref + '"/>' }
    ];
  }
  const sdEnd = /<\/sheetData>/.exec(xml);
  const insertAt = sdEnd ? sdEnd.index + sdEnd[0].length : xml.length;
  return [{ start: insertAt, end: insertAt,
    text: '<mergeCells count="1"><mergeCell ref="' + ref + '"/></mergeCells>' }];
}

function planDimension(xml, targetCol, maxRow) {
  const dM = /<dimension ref="([A-Za-z]+)(\d+):([A-Za-z]+)(\d+)"\s*\/>/.exec(xml);
  if (!dM) return null;
  const endColIdx = L.colToIndex(dM[3]);
  const endRow = parseInt(dM[4], 10);
  const newEndCol = Math.max(endColIdx, targetCol);
  const newEndRow = Math.max(endRow, maxRow);
  if (newEndCol === endColIdx && newEndRow === endRow) return null;
  return {
    start: dM.index, end: dM.index + dM[0].length,
    text: '<dimension ref="' + dM[1] + dM[2] + ':' + L.indexToCol(newEndCol) + newEndRow + '"/>'
  };
}

/* Применяет правки к исходной строке: сортирует по убыванию start и режет
   строку от конца к началу — более ранние смещения остаются верными. */
function applyEdits(xml, edits) {
  const sorted = edits.filter(Boolean).sort(function (a, b) { return b.start - a.start; });
  let out = xml;
  for (const e of sorted) out = out.slice(0, e.start) + e.text + out.slice(e.end);
  return out;
}

/* ───────────────────────── резолв активного листа ───────────────────────── */
/* Тот же принцип, что и везде в панели (АП, источники) — берём первый лист
   книги. Логика резолва пути через workbook.xml + rels зеркалит внутреннюю
   часть OmniLib.readXlsx (там она не экспортирована как отдельная функция). */
function firstSheetPath(wbXml, relsXml) {
  const rels = {};
  const relRe = /<Relationship\b([^>]*)\/?>/g;
  let rm;
  while ((rm = relRe.exec(relsXml))) {
    const a = rm[1];
    const id = /\bId="([^"]+)"/.exec(a);
    const tgt = /\bTarget="([^"]+)"/.exec(a);
    if (id && tgt) rels[id[1]] = L.unescapeXml(tgt[1]);
  }
  const sm = /<sheet\b([^>]*)\/?>/.exec(wbXml);
  if (!sm) return null;
  const a = sm[1];
  const nameM = /\bname="([^"]*)"/.exec(a);
  const ridM = /\br:id="([^"]+)"/.exec(a) || /\bid="([^"]+)"/.exec(a);
  const name = nameM ? L.unescapeXml(nameM[1]) : 'Sheet1';
  let target = ridM ? rels[ridM[1]] : null;
  if (!target) target = 'worksheets/sheet1.xml';
  let path = target.replace(/^\/+/, '');
  if (!/^xl\//.test(path)) path = 'xl/' + path;
  return { name: name, path: path };
}

async function entryText(zip, entry) {
  const bytes = await L.zipRead(zip, entry);
  return new TextDecoder('utf-8').decode(bytes);
}

/* ─────────────────────────── правка одного файла ────────────────────────── */

async function patchFile(file, azimuthMap, options) {
  const opt = Object.assign({}, DEFAULTS, options || {});
  const zip = await L.zipOpen(L.blobSource(file));
  const byName = new Map();
  for (const e of zip.entries) if (!e.isDir) byName.set(e.name.replace(/^\/+/, ''), e);

  const result = { name: file.name };

  const wbEntry = byName.get('xl/workbook.xml');
  if (!wbEntry) return Object.assign(result, { action: 'skipped', reason: 'это не файл .xlsx' });

  const wbXml = await entryText(zip, wbEntry);
  const relsEntry = byName.get('xl/_rels/workbook.xml.rels');
  const relsXml = relsEntry ? await entryText(zip, relsEntry) : '';
  const sheetInfo = firstSheetPath(wbXml, relsXml);
  const sheetEntry = sheetInfo && byName.get(sheetInfo.path);
  if (!sheetEntry) return Object.assign(result, { action: 'skipped', reason: 'не нашёл лист в архиве' });

  let sheetXml = await entryText(zip, sheetEntry);

  let shared = [];
  const ssEntry = byName.get('xl/sharedStrings.xml');
  if (ssEntry) shared = L.parseSharedStrings(await entryText(zip, ssEntry));

  const rows = parseRows(sheetXml);
  const rowByNum = new Map(rows.map(function (r) { return [r.num, r]; }));
  const sortedNums = rows.map(function (r) { return r.num; }).sort(function (a, b) { return a - b; });
  const maxRow = maxRowUsed(rows);

  const gidHit = findHeaderCell(rows, opt.gidColumn, opt.headerScanRows, shared);
  if (!gidHit) {
    return Object.assign(result, {
      action: 'skipped',
      reason: 'столбец «' + opt.gidColumn + '» не найден в первых ' + opt.headerScanRows + ' строках',
      matched: 0, unmatched: 0
    });
  }
  const gidCol = gidHit.col;
  const span = mergeSpan(sheetXml, gidHit.row, gidCol);
  const headerStart = span.start, headerEnd = span.end;
  const dataStart = detectDataStart(rowByNum, maxRow, headerEnd, gidCol, shared);

  const azHit = findHeaderCell(rows, opt.azimuthHeader, opt.headerScanRows, shared);
  const isNew = !azHit;
  const targetCol = isNew ? maxColumnUsed(rows) + 1 : azHit.col;

  const edits = [];

  // шапка (сама «Азимут» — в верхней строке диапазона; остальные строки
  // диапазона — пустые ячейки со стилем соседней GID-подстроки, как в
  // add_azimuth.py)
  for (let r = headerStart; r <= headerEnd; r++) {
    const row = rowByNum.get(r);
    const gidCell = row ? cellInRow(row, gidCol) : null;
    const style = styleAttrOf(gidCell);
    const value = (r === headerStart) ? opt.azimuthHeader : null;
    edits.push(planRowEdit(sheetXml, rowByNum, sortedNums, r, targetCol, style, value));
    if (row) { const sp = planSpansEdit(row, targetCol); if (sp) edits.push(sp); }
  }

  // данные
  let matched = 0, unmatched = 0;
  for (let r = dataStart; r <= maxRow; r++) {
    const row = rowByNum.get(r);
    if (!row) continue;
    const gidCell = cellInRow(row, gidCol);
    const gidVal = cellValue(gidCell, shared);
    const style = styleAttrOf(gidCell);
    let value = null;
    if (gidVal !== null && String(gidVal).trim() !== '') {
      const az = azimuthMap.get(String(gidVal).trim());
      if (az !== undefined && az !== null && az !== '') { value = az; matched++; }
      else { unmatched++; }
    }
    edits.push(planRowEdit(sheetXml, rowByNum, sortedNums, r, targetCol, style, value));
    const sp = planSpansEdit(row, targetCol); if (sp) edits.push(sp);
  }

  if (isNew) {
    const colEdit = planColWidth(sheetXml, gidCol, targetCol);
    if (colEdit) edits.push(colEdit);
    const mergeEdits = planMerge(sheetXml, headerStart, headerEnd, targetCol);
    if (mergeEdits) edits.push.apply(edits, mergeEdits);
  }
  const dimEdit = planDimension(sheetXml, targetCol, maxRow);
  if (dimEdit) edits.push(dimEdit);

  sheetXml = applyEdits(sheetXml, edits);

  // ── пересобираем zip: непосещённые записи — байт-в-байт, лист — новый ──
  const outFiles = [];
  for (const e of zip.entries) {
    if (e.isDir) continue;
    if (e === sheetEntry) {
      outFiles.push({ name: e.name, bytes: L.encodeUtf8(sheetXml) });
    } else {
      outFiles.push({ name: e.name, bytes: await L.zipRead(zip, e) });
    }
  }
  const blob = L.zipWrite(outFiles);

  return Object.assign(result, {
    action: isNew ? 'added' : 'updated',
    matched: matched, unmatched: unmatched,
    headerRow: headerStart, dataStartRow: dataStart, targetCol: targetCol,
    blob: blob
  });
}

root.AzimuthCore = {
  DEFAULTS: DEFAULTS,
  loadAzimuthMap: loadAzimuthMap,
  patchFile: patchFile,
  /* низкоуровневые — используются гайдом и тестами */
  parseRows: parseRows,
  cellValue: cellValue,
  findHeaderCell: findHeaderCell,
  mergeSpan: mergeSpan,
  detectDataStart: detectDataStart
};

})(typeof globalThis !== 'undefined' ? globalThis : this);

if (typeof module !== 'undefined' && module.exports) module.exports = globalThis.AzimuthCore;

</script>
<script>
/* ============================================================================
   Инвенто — подготовка эфирной справки к отправке клиенту (порт script.py).

   Делает три вещи с исходным xlsx:
     1. удаляет столбец «Комиссия платформы» (наша внутренняя комиссия — не
        для клиента);
     2. вставляет столбец «№» в начало и нумерует строки по порядку;
     3. переставляет строки: сначала показанные строки (Кол-во показов > 0),
        отсортированные по GID, затем непоказанные — в исходном порядке.

   Как и в азимутах — это ХИРУРГИЧЕСКАЯ правка XML одного листа внутри ZIP,
   а не readXlsx/writeXlsx. Причина та же: обычный openpyxl-подход (что и
   делает исходный script.py через ws.insert_cols/ws.delete_cols) на практике
   ломает форматирование — не косметически, а заметно:

     - ws.insert_cols(1) не переносит ширину столбцов дальше вставленного:
       из 11 заданных ширин в реальном файле после вставки+удаления остаются
       всего 5 — остальные столбцы (Город, Формат экрана, Бюджет, Сумма OTS…)
       съезжают на автоширину;
     - у новой ячейки «№» в шапке нет вообще никакого стиля — ни жирного, ни
       зелёной заливки, ни рамки, — хотя все соседние ячейки шапки её имеют
       (обнаружено сравнением реального input/output script.py: столбец A11
       выходит с fill=none/bold=False, у остальных — fill=E2EFD9/bold=True);
     - число потом перезаписывается Excel-ем при пересохранении числового
       формата («# ##0» → «#\ ##0» — визуально то же, но лишний дифф).

   Здесь же ни один стиль не декомпозируется и не создаётся заново: каждая
   существующая ячейка просто переезжает на новые координаты (меняется
   только r="...", всё остальное — s=, t=, содержимое — байт-в-байт), а
   новые ячейки «№» берут ЦЕЛИКОМ индекс стиля соседней ячейки той же
   (новой) строки. Ширины столбцов пересчитываются той же перестановкой, а
   не пересобираются заново. Гиперссылки (переезжают вместе со своей
   ячейкой) и все остальные части архива (styles.xml, sharedStrings.xml,
   темы) копируются в новый ZIP байт-в-байт.

   Зависит от OmniLib.
   ========================================================================== */
(function (root) {
'use strict';

const L = root.OmniLib;

const DEFAULTS = {
  gidHeader: 'GID',
  impHeader: 'Кол-во показов',
  dropHeader: 'Комиссия платформы',
  numberHeader: '№',
  numberColWidth: 6,
  headerScanRows: 60
};

/* Та же лениво-квантифицированная регулярка, что и в azimuth-core.js/omnilib.js —
   жадная версия на самозакрывающихся пустых ячейках склеивает соседние
   элементы и тихо портит данные (подробности там же). */
const ROW_RE = /<row\b([^>]*?)(\/>|>([\s\S]*?)<\/row>)/g;
const CELL_RE = /<c\b([^>]*?)(\/>|>([\s\S]*?)<\/c>)/g;

function parseRows(xml) {
  const rows = [];
  const re = new RegExp(ROW_RE);
  let m;
  while ((m = re.exec(xml))) {
    const attrs = m[1] || '';
    const selfClosing = m[2] === '/>';
    const inner = selfClosing ? '' : (m[3] || '');
    const rAttr = /\br="(\d+)"/.exec(attrs);
    const num = rAttr ? parseInt(rAttr[1], 10) : (rows.length + 1);
    rows.push({ num: num, attrs: attrs, cells: parseCells(inner) });
  }
  return rows;
}

function parseCells(inner) {
  const cells = [];
  const re = new RegExp(CELL_RE);
  let m, autoCol = 0;
  while ((m = re.exec(inner))) {
    const attrs = m[1] || '';
    const selfClosing = m[2] === '/>';
    const body = selfClosing ? '' : (m[3] || '');
    const refM = /\br="([A-Za-z]+)\d+"/.exec(attrs);
    const col = refM ? L.colToIndex(refM[1]) : autoCol;
    autoCol = col + 1;
    cells.push({ col: col, attrs: attrs, selfClosing: selfClosing, body: body });
  }
  return cells;
}

function cellValue(cell, shared) {
  if (!cell) return null;
  const tM = /\bt="([^"]+)"/.exec(cell.attrs);
  const type = tM ? tM[1] : 'n';
  if (type === 'inlineStr') {
    let text = '';
    const tRe = /<t\b[^>]*>([\s\S]*?)<\/t>|<t\b[^>]*\/>/g;
    let t;
    while ((t = tRe.exec(cell.body))) text += L.unescapeXml(t[1] || '');
    return text;
  }
  const vM = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(cell.body);
  const raw = vM ? L.unescapeXml(vM[1]) : null;
  if (raw === null || raw === '') return null;
  if (type === 's') return (shared && shared[parseInt(raw, 10)]) !== undefined ? shared[parseInt(raw, 10)] : null;
  if (type === 'str' || type === 'e') return raw;
  if (type === 'b') return raw === '1';
  const num = Number(raw);
  return isNaN(num) ? raw : num;
}

function cellInRow(row, col) {
  for (const c of row.cells) if (c.col === col) return c;
  return null;
}

function styleAttrOf(cell) {
  if (!cell) return '';
  const sM = /\bs="(\d+)"/.exec(cell.attrs);
  return sM ? sM[0] : '';
}

/* Ищет ячейку с текстом targetName (без учёта регистра) в первых maxRows
   строках листа — так находим строку шапки и столбец GID. */
function findHeaderCell(rows, targetName, maxRows, shared) {
  const target = targetName.trim().toLowerCase();
  for (const row of rows) {
    if (row.num > maxRows) continue;
    for (const cell of row.cells) {
      const v = cellValue(cell, shared);
      if (v !== null && String(v).trim().toLowerCase() === target) return { row: row.num, col: cell.col };
    }
  }
  return null;
}

/* Ищет ячейку с таким текстом ТОЛЬКО в указанной строке (остальные столбцы
   шапки — они все в одной строке с GID, отдельного скана не нужно). */
function findInRow(row, targetName, shared) {
  if (!row) return null;
  const target = targetName.trim().toLowerCase();
  for (const cell of row.cells) {
    const v = cellValue(cell, shared);
    if (v !== null && String(v).trim().toLowerCase() === target) return cell.col;
  }
  return null;
}

function maxRowUsed(rows) {
  let max = 0;
  for (const row of rows) if (row.num > max) max = row.num;
  return max;
}

/* Некоторые выгрузки делают шапку в 2 физические строки — вертикальный
   мёрдж A11:A12, B11:B12... (например, у столбцов «Источник OTS» и
   «Фотоотчет» вторая строка несёт легенду «Фото 1» вместо мёрджа).
   cellValue/cellInRow читают XML буквально и не знают про <mergeCells>,
   поэтому вторая строка шапки выглядит как обычная строка данных с кучей
   пустых строк — а пустой GID ('') сортируется раньше любого настоящего
   и отъедает номер 1 у первого реального экрана. Раздвигаем dataStart за
   нижнюю границу любого мёрджа, начинающегося в headerRow. */
function mergedHeaderBottom(sheetXml, headerRow) {
  let bottom = headerRow;
  const mcRe = /<mergeCell\s+ref="[A-Za-z]+(\d+):[A-Za-z]+(\d+)"\s*\/>/g;
  let m;
  while ((m = mcRe.exec(sheetXml))) {
    const r1 = parseInt(m[1], 10), r2 = parseInt(m[2], 10);
    if (r1 <= headerRow && r2 > bottom) bottom = r2;
  }
  return bottom;
}

/* ─────────────────── перестановка координат ─────────────────── */

/* Столбец: dropCol удаляется целиком, всё после него сдвигается влево на 1,
   затем всё сдвигается вправо на 1 (вставка нового столбца в начало).
   Итог для столбца ПОСЛЕ dropCol — тот же самый номер (сдвиги гасят друг
   друга); для столбца ДО dropCol — просто +1. */
function remapColumn(oldCol0, dropCol0) {
  if (dropCol0 !== null && oldCol0 === dropCol0) return null;
  let c = oldCol0;
  if (dropCol0 !== null && oldCol0 > dropCol0) c -= 1;
  return c + 1;
}

/* Ключ сортировки — точный аналог str(x[0][GID_COL-1]) из script.py: у
   Python str(None) == 'None', а не пустая строка — тот же ключ и здесь,
   чтобы порядок совпадал буква в букву. */
function gidSortKey(v) {
  if (v === null || v === undefined) return 'None';
  return String(v);
}

/* ─────────────────────────── правка файла ──────────────────────────── */

async function firstSheetPath(wbXml, relsXml) {
  const rels = {};
  const relRe = /<Relationship\b([^>]*)\/?>/g;
  let rm;
  while ((rm = relRe.exec(relsXml))) {
    const a = rm[1];
    const id = /\bId="([^"]+)"/.exec(a);
    const tgt = /\bTarget="([^"]+)"/.exec(a);
    if (id && tgt) rels[id[1]] = L.unescapeXml(tgt[1]);
  }
  const sm = /<sheet\b([^>]*)\/?>/.exec(wbXml);
  if (!sm) return null;
  const a = sm[1];
  const nameM = /\bname="([^"]*)"/.exec(a);
  const ridM = /\br:id="([^"]+)"/.exec(a) || /\bid="([^"]+)"/.exec(a);
  const name = nameM ? L.unescapeXml(nameM[1]) : 'Sheet1';
  let target = ridM ? rels[ridM[1]] : null;
  if (!target) target = 'worksheets/sheet1.xml';
  let path = target.replace(/^\/+/, '');
  if (!/^xl\//.test(path)) path = 'xl/' + path;
  return { name: name, path: path };
}

async function entryText(zip, entry) {
  return new TextDecoder('utf-8').decode(await L.zipRead(zip, entry));
}

async function patchFile(file, options) {
  const opt = Object.assign({}, DEFAULTS, options || {});
  const zip = await L.zipOpen(L.blobSource(file));
  const byName = new Map();
  for (const e of zip.entries) if (!e.isDir) byName.set(e.name.replace(/^\/+/, ''), e);

  const result = { name: file.name };

  const wbEntry = byName.get('xl/workbook.xml');
  if (!wbEntry) return Object.assign(result, { action: 'skipped', reason: 'это не файл .xlsx' });
  const wbXml = await entryText(zip, wbEntry);
  const relsEntry = byName.get('xl/_rels/workbook.xml.rels');
  const relsXml = relsEntry ? await entryText(zip, relsEntry) : '';
  const sheetInfo = await firstSheetPath(wbXml, relsXml);
  const sheetEntry = sheetInfo && byName.get(sheetInfo.path);
  if (!sheetEntry) return Object.assign(result, { action: 'skipped', reason: 'не нашёл лист в архиве' });

  let sheetXml = await entryText(zip, sheetEntry);
  let shared = [];
  const ssEntry = byName.get('xl/sharedStrings.xml');
  if (ssEntry) shared = L.parseSharedStrings(await entryText(zip, ssEntry));

  const rows = parseRows(sheetXml);
  const maxRow = maxRowUsed(rows);

  const gidHit = findHeaderCell(rows, opt.gidHeader, opt.headerScanRows, shared);
  if (!gidHit) {
    return Object.assign(result, {
      action: 'skipped',
      reason: 'столбец «' + opt.gidHeader + '» не найден в первых ' + opt.headerScanRows + ' строках'
    });
  }
  const headerRow = gidHit.row, gidCol0 = gidHit.col;
  const rowByNum = new Map(rows.map(function (r) { return [r.num, r]; }));
  const headerRowObj = rowByNum.get(headerRow);

  const impCol0 = findInRow(headerRowObj, opt.impHeader, shared);
  const dropCol0 = findInRow(headerRowObj, opt.dropHeader, shared);
  const dataStart = mergedHeaderBottom(sheetXml, headerRow) + 1;
  const dataEnd = maxRow;

  // ── порядок строк данных: показанные (сорт по GID) → непоказанные (как были) ──
  const nonzero = [], zero = [];
  for (let r = dataStart; r <= dataEnd; r++) {
    const row = rowByNum.get(r);
    if (!row) continue;
    const imp = impCol0 === null ? 1 : cellValue(cellInRow(row, impCol0), shared);
    const isZero = imp === 0 || imp === null || imp === undefined;
    (isZero ? zero : nonzero).push(row);
  }
  nonzero.sort(function (a, b) {
    const ka = gidSortKey(cellValue(cellInRow(a, gidCol0), shared));
    const kb = gidSortKey(cellValue(cellInRow(b, gidCol0), shared));
    return ka < kb ? -1 : (ka > kb ? 1 : 0);
  });
  const orderedDataRows = nonzero.concat(zero);

  const newRowOf = new Map();  // старый номер строки → новый
  orderedDataRows.forEach(function (row, i) { newRowOf.set(row.num, dataStart + i); });

  // ── переносим все ячейки листа на новые координаты ──
  const byNewRow = new Map();  // newRow → [{col, xml}]
  function place(newRow, col0, xml) {
    let arr = byNewRow.get(newRow);
    if (!arr) { arr = []; byNewRow.set(newRow, arr); }
    arr.push({ col: col0, xml: xml });
  }
  function rebuildCell(cell, newCol0, newRow) {
    const ref = L.indexToCol(newCol0) + newRow;
    const newAttrs = /\br="[^"]*"/.test(cell.attrs)
      ? cell.attrs.replace(/\br="[^"]*"/, 'r="' + ref + '"')
      : ' r="' + ref + '"' + cell.attrs;
    return '<c' + newAttrs + (cell.selfClosing ? '/>' : '>' + cell.body + '</c>');
  }

  /* Лист сдвигается вправо целиком, вместе с шапкой отчёта над таблицей
     («Рекламодатель», «Период размещения», «Бюджет»…): подписи там длинные,
     а столбец A теперь узкий, под «№», — прижатые к левому краю, они бы
     обрезались о соседнее значение. Пустая колонка слева читается лучше. */
  function mapRow(r) {
    return (r >= dataStart && r <= dataEnd) ? newRowOf.get(r) : r;
  }

  for (const row of rows) {
    const newRow = mapRow(row.num);
    if (newRow === undefined) continue; // строка вне диапазона данных без записи (не бывает, но на всякий случай)
    for (const cell of row.cells) {
      const newCol0 = remapColumn(cell.col, dropCol0);
      if (newCol0 === null) continue; // столбец «Комиссия платформы» — выбрасываем
      place(newRow, newCol0, rebuildCell(cell, newCol0, newRow));
    }
  }

  // ── новый столбец «№»: в шапке — текст со стилем соседа, в данных — номер по порядку ──
  function neighborStyle(newRow) {
    const arr = byNewRow.get(newRow) || [];
    const sib = arr.find(function (c) { return c.col === 1; });
    if (!sib) return '';
    const sM = /\bs="(\d+)"/.exec(sib.xml);
    return sM ? ' ' + sM[0] : '';
  }
  function numberCell(newRow, col0, value, styleAttr) {
    const ref = L.indexToCol(col0) + newRow;
    if (typeof value === 'number') {
      return '<c r="' + ref + '"' + styleAttr + ' t="n"><v>' + value + '</v></c>';
    }
    return '<c r="' + ref + '"' + styleAttr + ' t="inlineStr"><is><t xml:space="preserve">' +
      L.escapeXml(String(value)) + '</t></is></c>';
  }
  place(headerRow, 0, numberCell(headerRow, 0, opt.numberHeader, neighborStyle(headerRow)));
  /* Шапка в две физические строки (A11:A12…): у соседей есть нижняя половинка,
     у нового «№» её не было — заголовок висел в верхней ячейке, а под ним
     зияла дыра без заливки и рамки. Кладём пустые ячейки того же стиля;
     сам мёрдж A11:A12 добавляется ниже, вместе с остальными. */
  for (let r = headerRow + 1; r < dataStart; r++) {
    place(r, 0, '<c r="' + L.indexToCol(0) + r + '"' + neighborStyle(r) + '/>');
  }
  orderedDataRows.forEach(function (row, i) {
    const newRow = dataStart + i;
    place(newRow, 0, numberCell(newRow, 0, i + 1, neighborStyle(newRow)));
  });

  // ── <sheetData> целиком по новым координатам ──
  const newRowNums = [...byNewRow.keys()].sort(function (a, b) { return a - b; });
  let sheetDataInner = '';
  for (const rn of newRowNums) {
    const cells = byNewRow.get(rn).sort(function (a, b) { return a.col - b.col; });
    sheetDataInner += '<row r="' + rn + '">' + cells.map(function (c) { return c.xml; }).join('') + '</row>';
  }
  sheetXml = sheetXml.replace(/<sheetData>[\s\S]*?<\/sheetData>/, '<sheetData>' + sheetDataInner + '</sheetData>');

  // ── <cols> — те же ширины, сдвинутые по той же формуле, плюс новый столбец «№» ──
  const colsM = /<cols>([\s\S]*?)<\/cols>/.exec(sheetXml);
  if (colsM) {
    const colRe = /<col\b([^>]*)\/>/g;
    const newCols = [];
    let cm;
    while ((cm = colRe.exec(colsM[1]))) {
      const a = cm[1];
      const minM = /\bmin="(\d+)"/.exec(a), maxM = /\bmax="(\d+)"/.exec(a);
      if (!minM || !maxM) continue;
      const lo = parseInt(minM[1], 10) - 1, hi = parseInt(maxM[1], 10) - 1; // 0-based
      const rest = a.replace(/\bmin="\d+"/, '').replace(/\bmax="\d+"/, '').replace(/\s{2,}/g, ' ').trim();
      for (let c = lo; c <= hi; c++) {
        const nc = remapColumn(c, dropCol0);
        if (nc === null) continue;
        newCols.push('<col min="' + (nc + 1) + '" max="' + (nc + 1) + '"' + (rest ? ' ' + rest : '') + '/>');
      }
    }
    newCols.push('<col min="1" max="1" width="' + opt.numberColWidth + '" customWidth="1"/>');
    newCols.sort(function (x, y) {
      return parseInt(/min="(\d+)"/.exec(x)[1], 10) - parseInt(/min="(\d+)"/.exec(y)[1], 10);
    });
    sheetXml = sheetXml.slice(0, colsM.index) + '<cols>' + newCols.join('') + '</cols>' +
      sheetXml.slice(colsM.index + colsM[0].length);
  }

  // ── <mergeCells> — те же мёрджи по новым координатам ──
  // Без этого весь блок оставался на исходных буквах и после вставки «№»
  // съезжал на столбец влево: вертикальные мёрджи шапки накрывали не свои
  // колонки, а горизонтальный «Фотоотчет» (M11:N11) вместо пары «Фото 1 /
  // Фото 2» захватывал «Источник OTS» — отсюда и спотыкание на двойном ФО.
  const mcM = /<mergeCells\b[^>]*>([\s\S]*?)<\/mergeCells>/.exec(sheetXml);
  if (mcM) {
    const refs = [];
    // «№» мёрджим на ту же высоту, что и соседние столбцы шапки
    if (dataStart > headerRow + 1) {
      refs.push(L.indexToCol(0) + headerRow + ':' + L.indexToCol(0) + (dataStart - 1));
    }
    const mcRe = /<mergeCell\b[^>]*\bref="([A-Za-z]+)(\d+):([A-Za-z]+)(\d+)"[^>]*\/>/g;
    let mc;
    while ((mc = mcRe.exec(mcM[1]))) {
      const r1 = parseInt(mc[2], 10), r2 = parseInt(mc[4], 10);
      const c1 = L.colToIndex(mc[1]), c2 = L.colToIndex(mc[3]);
      const nr1 = mapRow(r1), nr2 = mapRow(r2);
      if (nr1 === undefined || nr2 === undefined) continue;
      // край, стоявший ровно на удалённом столбце, поджимаем внутрь мёрджа
      const n1 = (c1 === dropCol0) ? remapColumn(c1 + 1, dropCol0) : remapColumn(c1, dropCol0);
      const n2 = (c2 === dropCol0) ? remapColumn(c2 - 1, dropCol0) : remapColumn(c2, dropCol0);
      if (n1 === null || n2 === null || n1 > n2 || nr1 > nr2) continue;
      refs.push(L.indexToCol(n1) + nr1 + ':' + L.indexToCol(n2) + nr2);
    }
    sheetXml = sheetXml.slice(0, mcM.index) +
      (refs.length
        ? '<mergeCells count="' + refs.length + '">' +
          refs.map(function (r) { return '<mergeCell ref="' + r + '"/>'; }).join('') + '</mergeCells>'
        : '') +
      sheetXml.slice(mcM.index + mcM[0].length);
  }

  // ── <dimension> — правый край уехал на столбец, Excel иначе «чинит» файл ──
  if (/<dimension\b[^>]*\/>/.test(sheetXml)) {
    let maxCol = 0, maxRowOut = 0;
    for (const [rn, arr] of byNewRow) {
      if (rn > maxRowOut) maxRowOut = rn;
      for (const c of arr) if (c.col > maxCol) maxCol = c.col;
    }
    sheetXml = sheetXml.replace(/<dimension\b[^>]*\/>/,
      '<dimension ref="A1:' + L.indexToCol(maxCol) + maxRowOut + '"/>');
  }

  // ── <hyperlinks> — те же ссылки, ref переезжает вместе с ячейкой ──
  const hlM = /<hyperlinks>([\s\S]*?)<\/hyperlinks>/.exec(sheetXml);
  if (hlM) {
    const hlRe = /<hyperlink\b([^>]*)\/>/g;
    const newLinks = [];
    let hm;
    while ((hm = hlRe.exec(hlM[1]))) {
      const a = hm[1];
      const refM = /\bref="([A-Za-z]+)(\d+)"/.exec(a);
      if (!refM) continue;
      const oldCol0 = L.colToIndex(refM[1]), oldRow = parseInt(refM[2], 10);
      const newRow = mapRow(oldRow);
      const newCol0 = remapColumn(oldCol0, dropCol0);
      if (newCol0 === null || newRow === undefined) continue; // ссылка была в удалённом столбце/строке
      const newRef = L.indexToCol(newCol0) + newRow;
      newLinks.push('<hyperlink' + a.replace(/\bref="[^"]*"/, 'ref="' + newRef + '"') + '/>');
    }
    sheetXml = sheetXml.slice(0, hlM.index) +
      (newLinks.length ? '<hyperlinks>' + newLinks.join('') + '</hyperlinks>' : '') +
      sheetXml.slice(hlM.index + hlM[0].length);
  }

  const outFiles = [];
  for (const e of zip.entries) {
    if (e.isDir) continue;
    outFiles.push({ name: e.name, bytes: (e === sheetEntry) ? L.encodeUtf8(sheetXml) : await L.zipRead(zip, e) });
  }
  const blob = L.zipWrite(outFiles);

  return Object.assign(result, {
    action: 'ok',
    headerRow: headerRow,
    rows: orderedDataRows.length,
    nonzero: nonzero.length,
    zero: zero.length,
    droppedColumn: dropCol0 !== null,
    dropNote: dropCol0 === null ? 'столбец «' + opt.dropHeader + '» не найден — ничего не удалено' : null,
    impNote: impCol0 === null ? 'столбец «' + opt.impHeader + '» не найден — сортировка без разделения на показанные/непоказанные' : null,
    blob: blob
  });
}

root.InventoryCore = {
  DEFAULTS: DEFAULTS,
  patchFile: patchFile,
  /* низкоуровневые — для гайда/тестов */
  parseRows: parseRows,
  cellValue: cellValue,
  findHeaderCell: findHeaderCell,
  findInRow: findInRow,
  remapColumn: remapColumn,
  gidSortKey: gidSortKey,
  mergedHeaderBottom: mergedHeaderBottom
};

})(typeof globalThis !== 'undefined' ? globalThis : this);

if (typeof module !== 'undefined' && module.exports) module.exports = globalThis.InventoryCore;

</script>
<script>
/* ============================================================================
   Содержание гайдов. Отрисовкой занимается lib/guide-ui.js.

   Гайд = несколько слайдов. Виды слайдов:
     intro  — зачем инструмент и что он экономит
     steps  — что делать, по шагам
     demo   — живое мини-демо (id демо ищется в реестре guide-ui.js)

/* ============================================================================
   Движок гайдов: рисует слайды из lib/guide-data.js и оживляет мини-демо.

   Гайд открывается в iframe внутри панели: какой инструмент показывать,
   говорит #tool=<id> в адресе. Наружу общаемся через postMessage — открыть
   инструмент, открыть его с демо-данными, закрыть, отметить как прочитанный.
   Хранение прочитанных на стороне панели: у неё один localStorage на всё,
   а iframe с blob:-адресом до него дотягивается не везде.

   Мини-демо считают НАСТОЯЩИМ кодом инструментов (TTCore.lookupDuration,
   MergeCore.mergeTables, OmniLib.reduceRatio) — иначе гайд рано или поздно
   начнёт врать про поведение, которое рядом изменили.
   ========================================================================== */
(function (root) {
'use strict';

const D = root.OmniGuideData;
const L = root.OmniLib;
const T = root.TTCore;
const M = root.MergeCore;
const AZ = root.AzimuthCore;
const IC = root.InventoryCore;
const VD = root.VideoCore;

const $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function post(msg) {
  try { root.parent.postMessage({ omniGuide: msg }, '*'); } catch (e) { /* нет родителя */ }
}

/* ─────────────────────────────── состояние ─────────────────────────────── */

function toolFromHash() {
  const m = /(?:^|[#&])tool=([A-Za-z0-9_-]+)/.exec(root.location.hash || '');
  return m ? m[1] : null;
}

const toolId = toolFromHash();
const guide = toolId ? D.GUIDES[toolId] : null;
const savings = toolId ? D.SAVINGS[toolId] : null;

let idx = 0;
const visited = new Set([0]);

/* ─────────────────────────── отрисовка слайдов ─────────────────────────── */

function introHtml(s) {
  let h = '<div class="g-kick">зачем это</div>' +
          '<div class="g-h2">' + esc(s.h) + '</div>';
  for (const p of s.lead) h += '<div class="g-lead">' + p + '</div>';

  if (savings) {
    h += '<div class="g-cmp">' +
      '<div class="g-cmp-box"><div class="g-cmp-k">руками</div>' +
        '<div class="g-cmp-v">' + esc(savings.manual) + '</div>' +
        '<div class="g-cmp-d">' + esc(savings.manualNote) + '</div></div>' +
      '<div class="g-arrow">→</div>' +
      '<div class="g-cmp-box now"><div class="g-cmp-k">здесь</div>' +
        '<div class="g-cmp-v">' + esc(savings.tool) + '</div>' +
        '<div class="g-cmp-d">' + esc(savings.toolNote) + '</div></div>' +
      '</div>' +
      '<div class="g-note-est">Объём для сравнения: ' + esc(savings.on) +
      '. Время «руками» — оценка, а не замер.</div>';
  }

  if (s.gain && s.gain.length) {
    h += '<div class="g-list">';
    for (const g of s.gain) h += '<div class="g-li"><span class="m">✓</span><span>' + g + '</span></div>';
    h += '</div>';
  }
  return h;
}

function stepsHtml(s) {
  let h = '<div class="g-kick">по шагам</div><div class="g-h2">' + esc(s.h) + '</div>';
  if (s.lead) for (const p of s.lead) h += '<div class="g-lead">' + p + '</div>';
  h += '<div class="g-steps">';
  s.items.forEach(function (it, i) {

}

function pitsHtml(s) {

}

function demoHtml(s) {

function finishHtml(s) {

    }
    h += '</div>';
  }
  return h;
}

const RENDER = { intro: introHtml, steps: stepsHtml, pits: pitsHtml, demo: demoHtml, finish: finishHtml };

function render() {
  const slides = guide.slides;
  const s = slides[idx];

  $('gBody').innerHTML = '<div class="g-slide">' + RENDER[s.kind](s) + '</div>';
  if (s.kind === 'demo' && DEMOS[s.demo]) DEMOS[s.demo]($('demoHost'));

  $('gCount').textContent = 'шаг ' + (idx + 1) + ' из ' + slides.length;

  $('gProg').innerHTML = slides.map(function (_, i) {
    return '<button data-i="' + i + '" class="' +
      (i === idx ? 'on' : (visited.has(i) ? 'seen' : '')) + '" title="' +
      esc(slides[i].h) + '"></button>';
  }).join('');
  [...$('gProg').children].forEach(function (b) {
    b.addEventListener('click', function () { go(parseInt(b.dataset.i, 10)); });
  });

  const last = idx === slides.length - 1;
  const cta = last ? (s.cta || {}) : null;
  let nav = '<button class="g-btn-sm" id="gPrev"' + (idx === 0 ? ' disabled' : '') + '>← Назад</button>';
  if (last) {
    nav += '<span class="sp"></span>';
    if (cta.demo) nav += '<button class="g-btn-sm" id="gDemoRun">' + esc(cta.demo) + '</button>';

    nav += '<span class="g-keyhint">стрелки ← → тоже работают</span><span class="sp"></span>' +
           '<button class="g-btn-pri" id="gNext">Далее →</button>';
  }
  $('gNav').innerHTML = nav;

  if ($('gPrev')) $('gPrev').addEventListener('click', function () { go(idx - 1); });
  if ($('gNext')) $('gNext').addEventListener('click', function () { go(idx + 1); });
  if ($('gOpen')) $('gOpen').addEventListener('click', function () {
    post({ action: 'open', tool: toolId });
  });
  if ($('gDemoRun')) $('gDemoRun').addEventListener('click', function () {
    post({ action: 'open', tool: toolId, demo: true });
  });

  $('gBody').scrollTop = 0;
}

function go(i) {
  if (i < 0 || i >= guide.slides.length || i === idx) return;
  idx = i;
  visited.add(i);
  render();
}

/* ═══════════════════════════════ мини-демо ══════════════════════════════ */

const DEMOS = {};

/* ── ТТ: настоящий поиск длительности по справочнику ── */
DEMOS.ttDuration = function (host) {
  const data = root.TTData;
  const ops = [...new Set(data.INVENTORY_DURATIONS.map(function (r) { return r[0]; }))];
  // Russ Outdoor в таблице связок нет — он обрабатывается отдельным правилом,
  // но в демо без него не показать самое интересное.
  if (!ops.some(function (o) { return L.normName(o) === 'russ outdoor'; })) ops.push('Russ Outdoor');
  ops.sort(function (a, b) { return a.localeCompare(b, 'ru'); });

  const fmts = [...new Set(
    data.INVENTORY_DURATIONS.map(function (r) { return r[1]; })
      .concat(data.RUSS_10SEC_FORMATS)
  )].sort();

  host.innerHTML =
    '<div class="g-demo-row">' +
      '<div class="field"><label>Оператор</label><select id="dOp">' +
        ops.map(function (o) {
          return '<option' + (o === 'Russ Outdoor' ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') +
      '</select></div>' +
      '<div class="field"><label>Формат экрана</label><select id="dFmt">' +
        fmts.map(function (f) {
          return '<option' + (f === 'CITY_FORMAT' ? ' selected' : '') + '>' + esc(f) + '</option>';
        }).join('') +
      '</select></div>' +
    '</div>' +
    '<div class="g-demo-out" id="dOut"></div>';

  function rule(op, fmt) {
    const n = L.normName(op);
    if (data.RUSS_OPERATORS.indexOf(n) >= 0) {
      return data.RUSS_10SEC_FORMATS.indexOf(fmt) >= 0
        ? 'правило Russ Outdoor: CITY_FORMAT и PVZ_SCREEN — 10 секунд'
        : 'правило Russ Outdoor: остальные форматы — 5 секунд';
    }
    if (data.MAER_OUTDOOR_OPERATORS.indexOf(n) >= 0) {
      return fmt === 'MEDIAFACADE'
        ? 'правило MAER (Outdoor): медиафасад — 10 секунд'
        : 'правило MAER (Outdoor): остальные форматы — 5 секунд';
    }
    if (Object.prototype.hasOwnProperty.call(data.FLAT_DURATIONS, n)) {
      return 'у этого оператора одна длительность на все форматы';
    }
    return 'из справочника связок «оператор + формат»';
  }

  function upd() {
    const op = $('dOp').value, fmt = $('dFmt').value;
    const dur = T.lookupDuration(op, fmt);
    $('dOut').innerHTML = dur === null
      ? '<div class="g-out-none">длительности нет</div>' +
        '<div class="g-out-k">Такой связки в справочнике нет. В отчёте строка будет с пустой ' +
        'длительностью и попадёт во вкладку с ненайденными — это сигнал, что связку надо добавить.</div>'
      : '<div class="g-out-big">' + dur + ' сек</div>' +
        '<div class="g-out-k">' + esc(rule(op, fmt)) + '</div>';
  }
  $('dOp').addEventListener('change', upd);
  $('dFmt').addEventListener('change', upd);
  upd();
};

    '<div class="g-demo-out" id="dScrOut"></div>';

  /* Правило один в один как в creatives-core: для Russ — точный размер, без
     исключений; остальным — то же соотношение сторон, и из подходящих (не
     меньше экрана) берётся САМЫЙ БОЛЬШОЙ, а не ближайший по размеру. Один
     такой файл потом покрывает сразу все экраны этого соотношения меньше
     себя — поэтому у операторов из примера ниже совпадает результат. */
  function pick(scr) {
    const russ = /russ/i.test(scr.op);
    if (russ) {
      const exact = creatives.filter(function (c) { return c.w === scr.w && c.h === scr.h; });
      return { best: exact[0] || null, rule: 'Russ Outdoor — только точное совпадение размера' };
    }
    const tr = L.reduceRatio(scr.w, scr.h);
    const fit = creatives.filter(function (c) {
      const cr = L.reduceRatio(c.w, c.h);
      return cr[0] === tr[0] && cr[1] === tr[1] && c.w >= scr.w && c.h >= scr.h;
    });
    const best = fit.length ? fit.reduce(function (a, b) {
      return a.w * a.h >= b.w * b.h ? a : b;
    }) : null;
    return { best: best, rule: 'тот же AR — самый большой доступный файл этого соотношения' };
  }

  function upd() {
    const scr = screens[parseInt($('dScr').value, 10)];
    const res = pick(scr);
    const tr = L.reduceRatio(scr.w, scr.h);

    $('dCre').innerHTML = creatives.map(function (c) {
      const r = L.reduceRatio(c.w, c.h);
      const hit = res.best && res.best.name === c.name;
      return '<tr class="' + (hit ? 'hit' : 'out') + '">' +
        '<td>' + esc(c.name) + '</td>' +
        '<td>' + c.w + '×' + c.h + '</td>' +
        '<td>' + r[0] + ':' + r[1] + '</td>' +
        '<td>' + (hit ? 'подходит' : '') + '</td></tr>';
    }).join('');

    if (res.best) {
      const exact = res.best.w === scr.w && res.best.h === scr.h;
      $('dScrOut').innerHTML =
        '<div class="g-out-big">' + esc(res.best.name) + '</div>' +
        '<div class="g-out-k">' + esc(res.rule) + '. Экран ' + scr.w + '×' + scr.h +
        ' (' + tr[0] + ':' + tr[1] + '), креатив ' + res.best.w + '×' + res.best.h +
        (exact ? ' — размер совпал точно.' : ' — с запасом, на экране уменьшится.') + '</div>';
    } else {
      $('dScrOut').innerHTML =
        '<div class="g-out-none">под этот экран крео нет</div>' +
        '<div class="g-out-k">' + esc(res.rule) + '. Экран попадёт в список незакрытых — ' +
        'это и есть то, что нужно запросить у дизайна.</div>';
    }
  }
  $('dScr').addEventListener('change', upd);
  upd();
};

/* ── адреса: снятие дублей по координатам ── */
DEMOS.addrDedupe = function (host) {
  // Так справочник и отдаёт: один объект приходит по нескольким страницам и
  // под слегка разными названиями, а координаты у него одни и те же.
  const raw = [
    { n: 'Пятёрочка', lat: 55.796100, lon: 49.106400 },
    { n: 'Пятёрочка, магазин', lat: 55.796100, lon: 49.106400 },
    { n: 'Пятёрочка', lat: 55.812300, lon: 49.121900 },
    { n: 'Пятёрочка', lat: 55.774500, lon: 49.138200 },
    { n: 'Пятёрочка (у дома)', lat: 55.774500, lon: 49.138200 },
    { n: 'Пятёрочка', lat: 55.830700, lon: 49.061500 },
    { n: 'Пятёрочка', lat: 55.830700, lon: 49.061500 }
  ];

  host.innerHTML =
    '<div class="g-mini-wrap"><table class="g-mini">' +
      '<thead><tr><th>Название</th><th>Широта</th><th>Долгота</th><th></th></tr></thead>' +
      '<tbody id="dRaw"></tbody></table></div>' +
    '<div class="btn-row" style="margin-top:12px">' +
      '<button class="g-btn-sm" id="dDedup">Снять дубли</button>' +
      '<button class="g-btn-sm" id="dReset" style="display:none">Показать как было</button>' +
    '</div>' +
    '<div class="g-demo-out" id="dRawOut"></div>';

  function draw(dedup) {
    const seen = new Set();
    const marks = raw.map(function (r) {
      const k = r.lat + ',' + r.lon;
      const dup = seen.has(k);
      seen.add(k);
      return dup;
    });
    $('dRaw').innerHTML = raw.map(function (r, i) {
      if (dedup && marks[i]) return '';
      return '<tr class="' + (dedup ? 'hit' : (marks[i] ? 'out' : '')) + '">' +
        '<td>' + esc(r.n) + '</td>' +
        '<td>' + r.lat.toFixed(6) + '</td>' +
        '<td>' + r.lon.toFixed(6) + '</td>' +
        '<td>' + (!dedup && marks[i] ? 'та же точка' : '') + '</td></tr>';
    }).join('');

    const kept = marks.filter(function (m) { return !m; }).length;
    $('dRawOut').innerHTML = dedup
      ? '<div class="g-out-big">' + kept + '</div>' +
        '<div class="g-out-k">Столько объектов попадёт в файл. Справочник отдал ' + raw.length +
        ' записей — ' + (raw.length - kept) + ' из них описывают те же точки.</div>'
      : '<div class="g-out-k">Справочник отдал ' + raw.length + ' записей. Совпадающие ' +
        'координаты помечены — именно по ним инструмент и снимает дубли, а не по названию.</div>';

    $('dDedup').style.display = dedup ? 'none' : '';
    $('dReset').style.display = dedup ? '' : 'none';
  }

  $('dDedup').addEventListener('click', function () { draw(true); });
  $('dReset').addEventListener('click', function () { draw(false); });
  draw(false);
};

/* ── калькулятор: та же формула, что в инструменте ── */
DEMOS.markup = function (host) {
  const TIERS = [10, 12, 14, 16, 20];

  host.innerHTML =
    '<div class="g-demo-row">' +
      '<div class="field"><label>Стоимость подрядчика, ₽</label>' +
        '<input type="number" id="dCon" value="500000" min="0" step="10000"></div>' +
      '<div class="field"><label>Мин. комиссия агентства, %</label>' +
        '<input type="number" id="dComm" value="10" min="0" step="0.5"></div>' +
    '</div>' +
    '<div class="g-demo-out" id="dMarkOut"></div>';

  function money(n) {
    return new Intl.NumberFormat('ru-RU', {
      style: 'currency', currency: 'RUB', maximumFractionDigits: 0
    }).format(n);
  }

  function upd() {
    const con = parseFloat($('dCon').value) || 0;
    const comm = parseFloat($('dComm').value);
    const minComm = isNaN(comm) || comm < 0 ? 10 : comm;
    const maxSK = Math.max.apply(null, TIERS) / 100;
    const denom = 1 - maxSK - minComm / 100;

    if (con <= 0) {
      $('dMarkOut').innerHTML = '<div class="g-out-k">Введите стоимость подрядчика.</div>';
      return;
    }
    if (denom <= 0) {
      $('dMarkOut').innerHTML = '<div class="g-out-none">решения нет</div>' +
        '<div class="g-out-k">Минимальная комиссия и максимальный СК вместе дают 100% и больше — ' +
        'делить не на что. Калькулятор в этом случае тоже показывает прочерк.</div>';
      return;
    }

    const list = con / denom;
    const markup = (list / con - 1) * 100;
    const worst = list * (1 - maxSK) - con;                       // при максимальном СК
    const best = list * (1 - Math.min.apply(null, TIERS) / 100) - con;  // при минимальном

    $('dMarkOut').innerHTML =
      '<div class="g-out-big">' + markup.toFixed(1) + '%</div>' +
      '<div class="g-out-k">Цена в системе: <b>' + money(list) + '</b>. ' +
      'При максимальном СК ' + Math.max.apply(null, TIERS) + '% заработаем ' + money(worst) +
      ', при минимальном ' + Math.min.apply(null, TIERS) + '% — ' + money(best) +
      '. Ступени взяты по умолчанию, в калькуляторе их можно поправить.</div>';
  }
  $('dCon').addEventListener('input', upd);
  $('dComm').addEventListener('input', upd);
  upd();
};

/* ── карта: сборка ссылок по координатам ── */
DEMOS.mapLinks = function (host) {
  host.innerHTML =
    '<div class="field"><label>Координаты точки</label>' +
      '<input type="text" id="dCoord" value="55.796100, 49.106400" spellcheck="false"></div>' +
    '<div class="g-demo-out" id="dCoordOut"></div>';

  function upd() {
    const m = /(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)/.exec($('dCoord').value || '');
    if (!m) {
      $('dCoordOut').innerHTML = '<div class="g-out-k">Ожидаются два числа: сначала широта, ' +
        'потом долгота — например <code>55.7961, 49.1064</code>.</div>';
      return;
    }
    const lat = m[1].replace(',', '.'), lon = m[2].replace(',', '.');
    const z = 16;
    const links = [
      ['Яндекс', 'https://yandex.ru/maps/?ll=' + lon + ',' + lat + '&z=' + z + '&pt=' + lon + ',' + lat],
      ['2ГИС', 'https://2gis.ru/geo/' + lon + ',' + lat],
      ['Google', 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon],
      ['OSM', 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon + '#map=' + z + '/' + lat + '/' + lon]
    ];
    $('dCoordOut').innerHTML =
      '<div class="g-list">' + links.map(function (l) {
        return '<div class="g-li"><span class="m">→</span><span><a href="' + esc(l[1]) +
          '" target="_blank" rel="noopener">' + esc(l[0]) + '</a> ' +
          '<span style="color:var(--dim)">· та же точка</span></span></div>';
      }).join('') + '</div>' +
      '<div class="g-out-k" style="margin-top:10px">Обратите внимание: у Яндекса и 2ГИС ' +
      'в адресе сначала идёт долгота, у Google и OSM — широта. Инструмент это учитывает, ' +
      'а при ручной копипасте так и уезжают в другой город.</div>';
  }
  $('dCoord').addEventListener('input', upd);
  upd();
};

/* ── мониторинг: расчёт темпа с настоящими порогами сервиса ── */
DEMOS.pace = function (host) {
  host.innerHTML =
    '<div class="g-demo-row">' +
      '<div class="field"><label>Бюджет, ₽</label>' +
        '<input type="number" id="pB" value="900000" min="0" step="50000"></div>' +
      '<div class="field"><label>Дней всего</label>' +
        '<input type="number" id="pT" value="30" min="1" step="1"></div>' +
    '</div>' +
    '<div class="g-demo-row" style="margin-top:10px">' +
      '<div class="field"><label>Дней прошло</label>' +
        '<input type="number" id="pP" value="10" min="0" step="1"></div>' +
      '<div class="field"><label>Потрачено, ₽</label>' +
        '<input type="number" id="pS" value="180000" min="0" step="10000"></div>' +
    '</div>' +
    '<div class="g-demo-out" id="pOut"></div>';

  function money(n) {
    return new Intl.NumberFormat('ru-RU', {
      style: 'currency', currency: 'RUB', maximumFractionDigits: 0
    }).format(n);
  }

  function upd() {
    const budget = parseFloat($('pB').value) || 0;
    const total = Math.max(1, parseInt($('pT').value, 10) || 1);
    const passed = Math.min(total, Math.max(0, parseInt($('pP').value, 10) || 0));
    const spent = parseFloat($('pS').value) || 0;

    const plan = budget / total * passed;
    const pace = plan > 0 ? spent / plan : 0;
    const left = Math.max(0, total - passed + 1);
    const remaining = Math.max(0, budget - spent);
    const daily = left > 0 ? remaining / left : 0;

    // Плана ещё нет — сравнивать не с чем. Сервис в этом случае тоже не строит
    // алерты: в первые полчаса эфира статистика ещё ни о чём не говорит.
    if (plan <= 0) {
      $('pOut').innerHTML = '<div class="g-out-k">Плана на этот момент ещё нет — ' +
        'кампания не начала вещать, сравнивать не с чем. Поставьте «дней прошло» ' +
        'больше нуля.</div>';
      return;
    }

    // Пороги — как в сервисе: <70% красный, <95% жёлтый, дальше зелёный.
    const label = pace < 0.70 ? 'Отстаём' : (pace < 0.95 ? 'Небольшое отставание' : 'В графике');
    const color = pace < 0.70 ? 'var(--err-text)' : (pace < 0.95 ? 'var(--warn-text)' : 'var(--ok-text)');

    $('pOut').innerHTML =
      '<div class="g-out-big" style="-webkit-text-fill-color:' + color +
        ';background-image:none;color:' + color + '">' + Math.round(pace * 100) + '% · ' + label + '</div>' +
      '<div class="g-out-k">План к этому дню: <b>' + money(plan) + '</b>, потрачено ' + money(spent) +
      '. Недобор: <b>' + money(Math.max(0, plan - spent)) + '</b>. ' +
      'Рекомендуемый суточный лимит на остаток: <b>' + money(daily) + '</b>.</div>' +
      '<div class="g-demo-hint">В сервисе тот же расчёт, но точнее: план считается по ' +
      'прошедшим эфирным часам, а лимит делится на дни, когда кампания действительно ' +
      'вещает. Поэтому у кампании с расписанием цифры будут отличаться от этой прикидки.</div>';
  }
  ['pB', 'pT', 'pP', 'pS'].forEach(function (id) {
    $(id).addEventListener('input', upd);
  });
  upd();
};

/* ── добавление азимутов: тот самый разбор шапки, что и в инструменте ──
   Две мини-таблицы XML собираются на месте и прогоняются через
   AzimuthCore.parseRows/findHeaderCell/mergeSpan/detectDataStart — то же
   самое определяет, с какой строки реально начинаются данные (и раньше в
   похожей логике путало под-заголовок с первой строкой данных). */
DEMOS.azimuthHeader = function (host) {
  const CASES = {
    plain: {
      title: 'Обычная — без объединения',
      rows: [
        [[0, 'Оператор'], [1, 'GID'], [2, 'Город']],
        [[0, 'Оп1'], [1, 'G-001'], [2, 'Казань']],
        [[0, 'Оп1'], [1, 'G-002'], [2, 'Уфа']]
      ],
      note: 'Данные начинаются сразу после шапки — раньше здесь и терялась первая строка.'
    },
    sub: {
      title: 'С под-заголовком',
      rows: [
        [[0, 'Оператор'], [1, 'GID'], [2, 'Показы']],
        [[2, 'Кол-во']],
        [[0, 'Оп1'], [1, 'G-777'], [2, 10]]
      ],
      note: 'В строке 2 ячейка GID пуста — это и есть настоящий признак подзаголовка, а не «в строке хоть что-то есть».'
    }
  };

  function buildXml(rowsSpec) {
    let x = '';
    rowsSpec.forEach(function (cells, i) {
      const num = i + 1;
      x += '<row r="' + num + '">';
      cells.forEach(function (pair) {
        const ref = L.indexToCol(pair[0]) + num;
        x += (typeof pair[1] === 'number')
          ? '<c r="' + ref + '" t="n"><v>' + pair[1] + '</v></c>'
          : '<c r="' + ref + '" t="inlineStr"><is><t>' + L.escapeXml(String(pair[1])) + '</t></is></c>';
      });
      x += '</row>';
    });
    return x;
  }

  host.innerHTML =
    '<div class="g-chips" id="azChips">' + Object.keys(CASES).map(function (k, i) {
      return '<button class="g-chip' + (i === 0 ? ' on' : '') + '" data-k="' + k + '">' + esc(CASES[k].title) + '</button>';
    }).join('') + '</div>' +
    '<div class="g-mini-wrap" style="margin-top:12px"><table class="g-mini">' +
      '<thead><tr><th>№</th><th>A</th><th>B</th><th>C</th><th></th></tr></thead>' +
      '<tbody id="azBody"></tbody></table></div>' +
    '<div class="g-demo-out" id="azOut"></div>';

  function draw(key) {
    [...$('azChips').children].forEach(function (b) { b.classList.toggle('on', b.dataset.k === key); });
    const c = CASES[key];
    const xml = buildXml(c.rows);
    const rows = AZ.parseRows(xml);
    const rowByNum = new Map(rows.map(function (r) { return [r.num, r]; }));
    const gidHit = AZ.findHeaderCell(rows, 'GID', 20, null);
    const maxRow = rows.reduce(function (m, r) { return Math.max(m, r.num); }, 0);
    const span = gidHit ? AZ.mergeSpan(xml, gidHit.row, gidHit.col) : null;
    const dataStart = span ? AZ.detectDataStart(rowByNum, maxRow, span.end, gidHit.col, null) : null;

    $('azBody').innerHTML = c.rows.map(function (cells, i) {
      const num = i + 1;
      const byCol = new Map(cells);
      const isHeader = gidHit && num === gidHit.row;
      const isData = num === dataStart;
      const skipped = !isHeader && dataStart && num < dataStart;
      const kind = isHeader ? 'шапка' : (isData ? 'данные ↓' : (skipped ? 'подзаголовок' : ''));
      const cls = skipped ? 'out' : (isData ? 'hit' : '');
      const tds = [0, 1, 2].map(function (col) {
        return '<td>' + (byCol.has(col) ? esc(byCol.get(col)) : '') + '</td>';
      });
      return '<tr class="' + cls + '"><td class="muted">' + num + '</td>' + tds.join('') +
        '<td class="muted">' + kind + '</td></tr>';
    }).join('');

    $('azOut').innerHTML = '<div class="g-out-k">' + esc(c.note) + ' Вычислено: шапка в строке <b>' +
      (gidHit ? gidHit.row : '—') + '</b>, данные — с строки <b>' + dataStart + '</b>.</div>';
  }
  [...$('azChips').children].forEach(function (b) {
    b.addEventListener('click', function () { draw(b.dataset.k); });
  });
  draw('plain');
};

/* Показывает ту же перестановку столбцов, что и настоящий инвенто-инструмент
   (IC.remapColumn): удаление «Комиссия платформы» + вставка «№» в начало —
   без пересборки стилей, только координаты. */
DEMOS.reportsColumns = function (host) {
  const HEADERS = ['Оператор', 'Город', 'GID', 'Формат экрана', 'Адрес', 'Сторона',
    'Фото', 'CPT', 'Кол-во показов', 'Бюджет', 'Комиссия платформы', 'Сумма OTS'];
  const dropCol0 = 10; // «Комиссия платформы» — 0-based индекс

  host.innerHTML =
    '<div class="g-mini-wrap"><table class="g-mini">' +
    '<thead><tr><th>Было</th><th>Столбец</th><th>Стало</th></tr></thead>' +
    '<tbody id="repBody"></tbody></table></div>' +
    '<div class="g-demo-out" id="repOut"></div>';

  $('repBody').innerHTML = HEADERS.map(function (h, i) {
    const newCol0 = IC.remapColumn(i, dropCol0);
    const dropped = newCol0 === null;
    const was = L.indexToCol(i), now = dropped ? '—' : L.indexToCol(newCol0);
    return '<tr class="' + (dropped ? 'out' : (i === 0 ? 'hit' : '')) + '">' +
      '<td class="muted">' + was + '</td><td>' + esc(h) + '</td>' +
      '<td class="muted">' + now + (dropped ? ' (удалён)' : '') + '</td></tr>';
  }).join('');

  $('repOut').innerHTML = '<div class="g-out-k">Столбец «№» (новый, сюда не входит) встаёт в A — всё, что было ' +
    'ДО «Комиссия платформы», сдвигается на 1 вправо; всё, что ПОСЛЕ — остаётся на месте (сдвиги от удаления ' +
    'и от вставки гасят друг друга). Стиль каждой ячейки при этом не пересобирается — переезжает целиком.</div>';
};

/* ── видео: пересчёт разрешения и план удлинения настоящим кодом ── */
DEMOS.videoScale = function (host) {
  host.innerHTML =
    '<div class="g-demo-row">' +
      '<div class="field"><label>Ролик</label><select id="vSrc">' +
        '<option value="1920x1080x10">1920×1080, 10 с</option>' +
        '<option value="720x360x5">720×360, 5 с</option>' +
        '<option value="1080x1920x15">1080×1920, 15 с</option>' +
      '</select></div>' +
      '<div class="field"><label>Вписать в ширину</label><select id="vW">' +
        '<option>1280</option><option selected>720</option><option>640</option><option>2560</option>' +
      '</select></div>' +
      '<div class="field"><label>Нужная длительность, с</label><select id="vDur">' +
        '<option>5</option><option selected>25</option><option>30</option>' +
      '</select></div>' +
    '</div>' +
    '<div class="g-demo-out" id="vOut"></div>';

  function upd() {
    const p = $('vSrc').value.split('x');
    const sw = +p[0], sh = +p[1], sd = +p[2];
    const scale = VD.scaleTo(sw, sh, +$('vW').value, null);
    const loop = VD.loopPlan(sd, +$('vDur').value);

    const res = scale
      ? '<div class="g-out-big">' + scale.w + '×' + scale.h + '</div>' +
        '<div class="g-out-k">Пропорции те же, стороны округлены до чётных — иначе H.264 ' +
        'не возьмёт кадр. Увеличивать инструмент не станет.</div>'
      : '<div class="g-out-none">разрешение оставим как есть</div>' +
        '<div class="g-out-k">Заданная ширина не меньше исходной: растянуть можно, но резче ' +
        'ролик от этого не станет.</div>';

    const dur = loop
      ? '<div class="g-out-k" style="margin-top:9px">Длительность ' + sd + ' → ' + $('vDur').value +
        ' с: ролик пройдёт ' + loop.copies + ' ' + VD.plural(loop.copies, ['раз', 'раза', 'раз']) +
        (loop.whole ? ' целиком.' : ', последний повтор обрежется на ' + VD.fmtNum(loop.lastCut, 2) + ' с.') +
        '</div>'
      : '<div class="g-out-k" style="margin-top:9px">Длительность ' + sd + ' → ' + $('vDur').value +
        ' с: удлинять не нужно, лишнее просто обрежется с конца.</div>';

    $('vOut').innerHTML = res + dur;
  }
  ['vSrc', 'vW', 'vDur'].forEach(function (id) { $(id).addEventListener('change', upd); });
  upd();
};

/* ════════════════════════════════ запуск ════════════════════════════════ */

if (!guide) {
  document.body.innerHTML =
    '<div class="g-card"><div class="note err" style="margin-top:24px">' +
    'Не понимаю, гайд какого инструмента открывать: в адресе нет <code>#tool=…</code>.' +
    '</div></div>';
} else {
  $('gIcon').textContent = guide.letter || '?';
  if (guide.ext) $('gIcon').classList.add('ext');
  $('gTitle').textContent = guide.title;
  $('gSub').textContent = guide.ext
    ? 'внешний сервис · как это работает'
    : 'как это работает';
  document.title = guide.title + ' — гайд';

  render();
  post({ action: 'seen', tool: toolId });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') go(idx + 1);
    else if (e.key === 'ArrowLeft') go(idx - 1);
    else if (e.key === 'Escape') post({ action: 'close' });
    else return;
    e.preventDefault();
  });
}

})(typeof globalThis !== 'undefined' ? globalThis : this);
