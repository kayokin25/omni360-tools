<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гайд</title>
<style>
/* Общий стиль инструментов панели Omni360 (один язык с калькулятором OmniBuy).
   Все цвета — через переменные: тему задаёт панель, применяет lib/theme.js. */
:root {
  --bg: #0a0e1a;
  --card: #111827;
  --line: #1e293b;
  --line-soft: #161f33;
  --text: #f1f5f9;
  --desc: #94a3b8;
  --muted: #64748b;
  --dim: #475569;
  --panel: #0f172a;
  --input-bg: #1e293b;
  --input-line: #334155;
  --code-bg: #0b1220;
  --accent: #00c6ff;
  --accent-2: #7bed9f;
  --accent-ink: #05121f;
  --link: #4f8cff;
  --shadow: 0 24px 60px rgba(0, 0, 0, .4);
  --row-hover: #151d30;
  --tile-bg: #0f172a;
  --scroll-track: #0b1220;
  --scroll-thumb: #283449;
  --ok-bg: #0d2018; --ok-line: #1e4d40; --ok-text: #7bed9f;
  --warn-bg: #241a08; --warn-line: #57400f; --warn-text: #fbbf24;
  --err-bg: #2a1215; --err-line: #5c2b2e; --err-text: #ff8a80;
  --info-bg: #0d1b2e; --info-line: #1e3a5f; --info-text: #93c5fd;
  --miss-bg: #1f1417; --miss-bg-hover: #2a1a1e;
  --drop-fill: linear-gradient(135deg, #0d2440, #0d2e20);
  --log-ok: #7bed9f; --log-warn: #fbbf24; --log-err: #f87171;
  /* Внешние сервисы в панели помечены сиреневым — гайды по ним держат тот же цвет. */
  --ext-icon-a: #312e5f; --ext-icon-b: #1f2544; --ext-text: #ddd6fe; --ext-line: #a78bfa;
}

:root[data-theme="light"] {
  --bg: #eef2f7;
  --card: #ffffff;
  --line: #dbe3ec;
  --line-soft: #edf1f6;
  --text: #0f172a;
  --desc: #475569;
  --muted: #64748b;
  --dim: #94a3b8;
  --panel: #f6f8fb;
  --input-bg: #ffffff;
  --input-line: #cbd5e1;
  --code-bg: #f6f8fb;
  --accent: #0284c7;
  --accent-2: #15803d;
  --accent-ink: #ffffff;
  --link: #0369a1;
  --shadow: 0 20px 50px rgba(15, 23, 42, .12);
  --row-hover: #f6f8fb;
  --tile-bg: #f6f8fb;
  --scroll-track: #eef2f7;
  --scroll-thumb: #c7d2e0;
  --ok-bg: #ecfdf5; --ok-line: #a7f3d0; --ok-text: #047857;
  --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-text: #92400e;
  --err-bg: #fef2f2; --err-line: #fecaca; --err-text: #b91c1c;
  --info-bg: #eff6ff; --info-line: #bfdbfe; --info-text: #1d4ed8;
  --miss-bg: #fef4f4; --miss-bg-hover: #fde8e8;
  --drop-fill: linear-gradient(135deg, #eff6ff, #ecfdf5);
  --log-ok: #047857; --log-warn: #b45309; --log-err: #b91c1c;
  --ext-icon-a: #ede9fe; --ext-icon-b: #e0e7ff; --ext-text: #4c1d95; --ext-line: #7c3aed;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  padding: 24px;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

.wrap { width: 100%; max-width: 980px; margin: 0 auto; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 32px;
  box-shadow: var(--shadow);
}

/* ── шапка ── */
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
.logo-dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); flex: none; }
/* background-image, а НЕ сокращённое background: сокращённая запись сбрасывает
   background-clip, и при переприсваивании цвета обрезка по тексту слетает —
   вместо букв виден градиентный прямоугольник. */
.logo-text { font-size: 18px; font-weight: 700; background-image: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.logo-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

h1 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.subtitle { font-size: 13px; color: var(--muted); margin-bottom: 26px; line-height: 1.5; }

.section-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .8px; color: var(--dim); margin: 24px 0 12px;
}
.section-label:first-of-type { margin-top: 0; }

.divider { height: 1px; background: var(--line); margin: 24px 0; }

/* ── поля ── */
.field { margin-bottom: 14px; }
label { display: block; font-size: 13px; color: var(--desc); margin-bottom: 6px; }
.hint { font-size: 11.5px; color: var(--dim); margin-top: 5px; line-height: 1.45; }

input[type=text], input[type=number], input[type=date], select {
  width: 100%; background: var(--input-bg); border: 1px solid var(--input-line);
  border-radius: 10px; color: var(--text); font-size: 14px;
  padding: 10px 13px; outline: none; transition: border-color .15s;
  font-family: inherit;
}
input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus { border-color: var(--accent); }
input[type=date] { color-scheme: light dark; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input:disabled, select:disabled, button:disabled { opacity: .5; cursor: not-allowed; }
input::placeholder { color: var(--dim); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* ── зона выбора файла ── */
.drop {
  border: 1.5px dashed var(--input-line); border-radius: 14px; padding: 22px 20px;
  text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  background: var(--panel);
}
.drop:hover, .drop.over { border-color: var(--accent); }
.drop .icon { font-size: 22px; margin-bottom: 8px; opacity: .85; }
.drop .main { font-size: 13.5px; color: var(--text); font-weight: 500; }
.drop .sub { font-size: 11.5px; color: var(--dim); margin-top: 5px; }
.drop.filled { border-style: solid; border-color: var(--ok-line); background: var(--drop-fill); }
.drop.filled .main { color: var(--ok-text); }
input[type=file] { display: none; }

/* ── кнопки ── */
.btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none;
  color: var(--accent-ink); font-size: 14px; font-weight: 700; padding: 12px 22px;
  border-radius: 11px; cursor: pointer; transition: transform .12s, filter .15s;
  font-family: inherit;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.ghost {
  background: var(--input-bg); border: 1px solid var(--input-line); color: var(--text); font-weight: 600;
}
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); filter: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }

/* ── прогресс ── */
.progress { margin-top: 18px; display: none; }
.progress.on { display: block; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 99px; transition: width .2s;
}
.bar.indet > i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
.progress-text { font-size: 12px; color: var(--desc); margin-top: 8px; min-height: 16px; }

.log {
  margin-top: 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--desc); max-height: 170px; overflow: auto; white-space: pre-wrap;
  word-break: break-word; display: none;
}
.log.on { display: block; }
.log b { color: var(--log-ok); font-weight: 600; }
.log i { color: var(--log-warn); font-style: normal; }
.log s { color: var(--log-err); text-decoration: none; }

/* ── плитки статистики ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { background: var(--tile-bg); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; }
.tile .v { font-size: 21px; font-weight: 800; color: var(--text); line-height: 1.15; }
.tile .k { font-size: 10.5px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .4px; }
.tile.good .v { background-image: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.tile.warn .v { color: var(--warn-text); }
.tile.bad .v { color: var(--err-text); }

/* ── таблица ── */
.table-wrap { border: 1px solid var(--line); border-radius: 12px; overflow: auto; max-height: 440px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  position: sticky; top: 0; z-index: 1; background: var(--panel); color: var(--muted);
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
  text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
tbody td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); color: var(--desc); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--row-hover); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nowrap { white-space: nowrap; }
td.muted { color: var(--muted); }
tbody tr.miss td { background: var(--miss-bg); }
tbody tr.miss:hover td { background: var(--miss-bg-hover); }
tbody tr.miss td:first-child { box-shadow: inset 3px 0 0 #b91c1c; }
tbody tr.ok td:first-child { box-shadow: inset 3px 0 0 #15803d; }
/* Раскрывающийся список креативов: заголовок группы (файл) выделен,
   строки операторов внутри — обычные, но с отступом первой колонки. */
tbody tr.grp td { background: var(--ok-bg); color: var(--text); font-weight: 600; }
tbody tr.grp:hover td { background: var(--ok-bg); }
tbody tr.op td:first-child { padding-left: 28px; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── сообщения ── */
.note {
  border-radius: 12px; padding: 13px 16px; font-size: 12.5px; line-height: 1.55;
  margin-bottom: 16px; border: 1px solid;
}
.note.info { background: var(--info-bg); border-color: var(--info-line); color: var(--info-text); }
.note.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text); }
.note.err { background: var(--err-bg); border-color: var(--err-line); color: var(--err-text); }
.note.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-text); }
.note b { font-weight: 700; }
.note code { font: 11.5px ui-monospace, Menlo, Consolas, monospace; background: rgba(127,127,127,.14); padding: 1px 5px; border-radius: 4px; }

.results { display: none; }
.results.on { display: block; }

/* ── табы ── */
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  font-size: 12px; font-weight: 600; padding: 7px 13px; border-radius: 9px;
  cursor: pointer; font-family: inherit; transition: all .13s;
}
.tab:hover { color: var(--text); border-color: var(--input-line); }
.tab.on { background: var(--input-bg); color: var(--text); border-color: var(--input-line); }
.tab .cnt { color: var(--dim); font-weight: 500; }
.tab.on .cnt { color: var(--desc); }

.footer { margin-top: 22px; text-align: center; font-size: 11px; color: var(--dim); }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: var(--scroll-track); }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 9px; }
::-webkit-scrollbar-thumb:hover { filter: brightness(1.2); }

</style>
<style>
/* Стили гайдов. Поверх lib/tool-ui.css — переменные и базовые элементы
   (кнопки, поля, таблицы, .note) берём оттуда, здесь только своё.

   Гайд живёт в iframe внутри модалки панели, поэтому прокрутка должна быть
   внутри карточки, а не у страницы: иначе модалка «прыгает» на переходах
   между слайдами. */

body.guide {
  padding: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
}

.g-card {
  width: 100%;
  max-width: 780px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 22px 26px 18px;
  gap: 16px;
}
@media (max-width: 560px) { .g-card { padding: 16px 16px 14px; } }

/* ── шапка ── */
.g-head { display: flex; align-items: center; gap: 12px; flex: none; }
.g-icon {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: var(--accent-ink);
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
/* Внешние сервисы и в панели выделены сиреневым — здесь то же самое,
   чтобы гайд не выглядел «чужим» относительно карточки. */
.g-icon.ext {
  background: linear-gradient(135deg, var(--ext-icon-a), var(--ext-icon-b));
  color: var(--ext-text); border: 1px dashed var(--ext-line);
}
.g-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.25; }
.g-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.g-count { margin-left: auto; font-size: 11.5px; color: var(--dim); white-space: nowrap; }

/* ── полоса шагов ── */
.g-prog { display: flex; gap: 4px; flex: none; }
.g-prog button {
  flex: 1; height: 4px; border: none; padding: 0; border-radius: 99px;
  background: var(--line); cursor: pointer; transition: background .15s;
}
.g-prog button:hover { background: var(--input-line); }
.g-prog button.seen { background: var(--input-line); }
.g-prog button.on { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* ── слайд ── */
.g-body { flex: 1; overflow: auto; padding-right: 4px; }
.g-slide { animation: g-in .18s ease; }
@keyframes g-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.g-kick {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .8px; color: var(--dim); margin-bottom: 8px;
}
.g-h2 { font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 8px; }
.g-lead { font-size: 13.5px; color: var(--desc); line-height: 1.6; }
.g-lead + .g-lead { margin-top: 9px; }
.g-lead b { color: var(--text); font-weight: 600; }
.g-lead code, .g-li code, .g-step-d code {
  font: 11.5px ui-monospace, Menlo, Consolas, monospace;
  background: rgba(127, 127, 127, .14); padding: 1px 5px; border-radius: 4px;
}

/* ── «вручную / здесь» ── */
.g-cmp { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; margin: 16px 0; }
@media (max-width: 560px) { .g-cmp { grid-template-columns: 1fr; } .g-cmp .g-arrow { display: none; } }
.g-cmp-box { background: var(--tile-bg); border: 1px solid var(--line); border-radius: 13px; padding: 13px 15px; }
.g-cmp-box.now { border-color: var(--ok-line); background: var(--ok-bg); }
.g-cmp-k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.g-cmp-box.now .g-cmp-k { color: var(--ok-text); opacity: .85; }
.g-cmp-v { font-size: 19px; font-weight: 800; color: var(--text); margin-top: 5px; line-height: 1.15; }
.g-cmp-box.now .g-cmp-v { color: var(--ok-text); }
.g-cmp-d { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
.g-arrow { display: flex; align-items: center; color: var(--dim); font-size: 17px; }

.g-note-est { font-size: 11px; color: var(--dim); margin-top: -6px; margin-bottom: 14px; line-height: 1.45; }

/* ── списки ── */
.g-list { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
.g-li { display: flex; gap: 9px; font-size: 13px; color: var(--desc); line-height: 1.55; }
.g-li .m { flex: none; color: var(--accent-2); font-weight: 700; }
.g-li b { color: var(--text); font-weight: 600; }

/* ── шаги ── */
.g-steps { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.g-step {
  display: flex; gap: 12px; background: var(--tile-bg); border: 1px solid var(--line);
  border-radius: 13px; padding: 13px 15px;
}
.g-step-n {
  width: 22px; height: 22px; border-radius: 7px; flex: none; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 700;
  background: var(--input-bg); border: 1px solid var(--input-line); color: var(--desc);
}
.g-step-t { font-size: 13.5px; font-weight: 600; color: var(--text); }
.g-step-d { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 3px; }

/* ── грабли ── */
.g-pits { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.g-pit {
  background: var(--warn-bg); border: 1px solid var(--warn-line);
  border-radius: 13px; padding: 12px 15px;
}
.g-pit-t { font-size: 13px; font-weight: 600; color: var(--warn-text); }
.g-pit-d { font-size: 12.5px; color: var(--desc); line-height: 1.55; margin-top: 4px; }

/* ── мини-демо ── */
.g-demo {
  border: 1px solid var(--input-line); border-radius: 14px; overflow: hidden;
  margin-top: 16px; background: var(--panel);
}
.g-demo-head {
  padding: 9px 14px; background: var(--input-bg); border-bottom: 1px solid var(--line);
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); display: flex; align-items: center; gap: 8px;
}
.g-demo-head .live {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2);
  box-shadow: 0 0 0 3px rgba(127, 127, 127, .12);
}
.g-demo-body { padding: 14px; }
.g-demo-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.g-demo-row > .field { flex: 1; min-width: 150px; margin-bottom: 0; }
.g-demo-out { margin-top: 13px; }
.g-out-big {
  font-size: 26px; font-weight: 800; line-height: 1.1;
  background-image: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.g-out-k { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.g-out-none { font-size: 13px; color: var(--err-text); font-weight: 600; }
.g-demo-hint { font-size: 11.5px; color: var(--dim); margin-top: 10px; line-height: 1.5; }

/* мини-таблица внутри демо */
.g-mini { width: 100%; border-collapse: collapse; font-size: 12px; }
.g-mini th {
  text-align: left; padding: 6px 9px; font-size: 10px; text-transform: uppercase;
  letter-spacing: .4px; color: var(--muted); border-bottom: 1px solid var(--line); font-weight: 600;
}
.g-mini td { padding: 6px 9px; border-bottom: 1px solid var(--line-soft); color: var(--desc); }
.g-mini tr:last-child td { border-bottom: none; }
.g-mini tr.hit td { background: var(--ok-bg); color: var(--ok-text); }
.g-mini tr.out td { opacity: .45; }
.g-mini-wrap { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--card); }
.g-mini-cap { font-size: 11px; color: var(--muted); margin-bottom: 6px; }

<script>
/* Тема инструмента.

   Инструмент открывается либо внутри панели (в iframe), либо отдельной
   страницей. Поэтому тему берём по порядку:
     1. #theme=... в адресе — так панель задаёт тему сразу, без мигания;
     2. сохранённая в localStorage — для отдельной страницы;
     3. системная настройка.

   Панель при переключении присылает postMessage — применяем на лету, чтобы
   открытый инструмент не перезагружался и не терял результаты. */
(function (root) {
'use strict';

const KEY = 'omni360.theme';

function fromHash() {
  const m = /(?:^|[#&])theme=(light|dark)\b/.exec(root.location.hash || '');
  return m ? m[1] : null;
}

function fromStorage() {
  try {
    const v = localStorage.getItem(KEY);
    return v === 'light' || v === 'dark' ? v : null;
  } catch (e) { return null; }   // приватный режим
}

function fromSystem() {
  try {
    return root.matchMedia && root.matchMedia('(prefers-color-scheme: light)').matches
      ? 'light' : 'dark';
  } catch (e) { return 'dark'; }
}

/* current объявляем ДО apply(): apply() его присваивает, а обращение к let-
   переменной до инициализации — ReferenceError. Раньше здесь было
   `let current = apply(...)`, и скрипт падал сразу после setAttribute: тема
   применялась, но слушатель postMessage уже не регистрировался. */
let current = 'dark';

function apply(theme) {
  const t = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  current = t;
  return t;
}

apply(fromHash() || fromStorage() || fromSystem());

/* Панель сообщает о переключении. Сообщения приходят от родительского
   документа панели; проверяем только форму — данных тут нет, лишь имя темы. */
root.addEventListener('message', function (e) {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.omniTheme !== 'light' && d.omniTheme !== 'dark') return;
  apply(d.omniTheme);
});

root.OmniTheme = {
  get: function () { return current; },
  apply: apply,
  /* Для отдельной страницы: запомнить выбор. Внутри панели выбор хранит панель. */
  save: function (theme) {
    const t = apply(theme);
    try { localStorage.setItem(KEY, t); } catch (e) { /* приватный режим */ }
    return t;
  },
  isEmbedded: function () {
    try { return root.parent !== root; } catch (e) { return true; }
  }
};

})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

<script>
/* ============================================================================
   Omni360 — общая мини-библиотека для инструментов панели.
   Без внешних зависимостей. Работает в браузере и в node (для тестов).

   Содержит:
     • ZIP-читалку с произвольным доступом (EOCD / ZIP64 / deflate-raw)
     • ZIP-писалку (STORED + CRC32, UTF-8 имена)
     • XLSX-читалку (workbook/rels/sharedStrings/sheet XML)
     • XLSX-писалку (стили, ширины, закрепление шапки, гиперссылки)
     • разбор пиксельных размеров MP4/MOV из байтов (boxes moov→…→stsd)
   ========================================================================== */
(function (root) {
'use strict';

/* ─────────────────────────── байтовые утилиты ─────────────────────────── */

function u16(b, o) { return b[o] | (b[o + 1] << 8); }
function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }
function u64(b, o) { // little-endian 64-бит как Number (хватает до 2^53)
  return u32(b, o) + u32(b, o + 4) * 4294967296;
}

// поиск последовательности байт в буфере (с конца или с начала)
function findSeq(buf, seq, from, backwards) {
  const n = buf.length, m = seq.length;
  if (backwards) {
    for (let i = (from === undefined ? n - m : from); i >= 0; i--) {
      let ok = true;
      for (let j = 0; j < m; j++) if (buf[i + j] !== seq[j]) { ok = false; break; }
      if (ok) return i;
    }
  } else {
    for (let i = (from || 0); i <= n - m; i++) {
      let ok = true;
      for (let j = 0; j < m; j++) if (buf[i + j] !== seq[j]) { ok = false; break; }
      if (ok) return i;
    }
  }
  return -1;
}

const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
const utf8Loose = new TextDecoder('utf-8');
function decodeName(bytes, utf8Flag) {
  if (utf8Flag) return utf8Loose.decode(bytes);
  // Без флага UTF-8 имя может быть в CP866/CP437 (архив из Windows).
  try { return utf8Decoder.decode(bytes); } catch (e) { /* не UTF-8 */ }
  try { return new TextDecoder('ibm866').decode(bytes); } catch (e) { return utf8Loose.decode(bytes); }
}

function encodeUtf8(s) { return new TextEncoder().encode(s); }

/* ─────────────────────────── источники байтов ─────────────────────────── */
/* source = { size, slice(start, end) -> Promise<Uint8Array> }                */

function blobSource(blob) {
  return {
    size: blob.size,
    name: blob.name || '',
    async slice(start, end) {
      const s = Math.max(0, start), e = Math.min(blob.size, end);
      if (e <= s) return new Uint8Array(0);
      return new Uint8Array(await blob.slice(s, e).arrayBuffer());
    }
  };
}

function bytesSource(bytes, name) {
  return {
    size: bytes.length,
    name: name || '',
    async slice(start, end) {
      return bytes.subarray(Math.max(0, start), Math.min(bytes.length, end));
    }
  };
}

/* ───────────────────────────── inflate (raw) ───────────────────────────── */

async function inflateRaw(bytes) {
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter();
  w.write(bytes); w.close();
  const parts = [];
  let total = 0;
  const r = ds.readable.getReader();
  for (;;) {
    const { done, value } = await r.read();
    if (done) break;
    parts.push(value); total += value.length;
  }
  const out = new Uint8Array(total);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

/* Потоковая распаковка с удержанием только «головы» и «хвоста» вывода.
   Нужна, чтобы читать размеры видео из огромных архивов, не съедая память. */
async function inflateRawHeadTail(source, compStart, compSize, headCap, tailCap) {
  const ds = new DecompressionStream('deflate-raw');
  const reader = ds.readable.getReader();
  const writer = ds.writable.getWriter();

  const head = new Uint8Array(headCap);
  let headLen = 0;
  let tail = new Uint8Array(0);
  let totalOut = 0;

  const pump = (async () => {
    const CHUNK = 1 << 20;
    try {
      for (let off = 0; off < compSize; off += CHUNK) {
        const chunk = await source.slice(compStart + off, compStart + Math.min(compSize, off + CHUNK));
        await writer.write(chunk);
      }
      await writer.close();
    } catch (e) { try { await writer.abort(e); } catch (e2) {} }
  })();

  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      totalOut += value.length;
      if (headLen < headCap) {
        const take = Math.min(headCap - headLen, value.length);
        head.set(value.subarray(0, take), headLen); headLen += take;
      }
      if (value.length >= tailCap) {
        tail = value.slice(value.length - tailCap);
      } else {
        const keep = Math.min(tailCap - value.length, tail.length);
        const nt = new Uint8Array(keep + value.length);
        nt.set(tail.subarray(tail.length - keep), 0);
        nt.set(value, keep);
        tail = nt;
      }
    }
  } finally {
    try { await pump; } catch (e) {}
  }
  return { head: head.subarray(0, headLen), tail: tail, totalOut: totalOut };
}

/* ──────────────────────────── ZIP: чтение ─────────────────────────────── */

const SIG_EOCD  = [0x50, 0x4b, 0x05, 0x06];
const SIG_EOCD64 = [0x50, 0x4b, 0x06, 0x06];
const SIG_LOC64 = [0x50, 0x4b, 0x06, 0x07];

async function zipOpen(source) {
  const tailLen = Math.min(source.size, 66000);
  const tail = await source.slice(source.size - tailLen, source.size);
  const eocdRel = findSeq(tail, SIG_EOCD, undefined, true);
  if (eocdRel < 0) throw new Error('Это не ZIP-архив (не найден EOCD)');

  let cdCount = u16(tail, eocdRel + 10);
  let cdSize = u32(tail, eocdRel + 12);
  let cdOffset = u32(tail, eocdRel + 16);

  // ZIP64: смотрим локатор перед EOCD
  const locRel = findSeq(tail, SIG_LOC64, eocdRel, true);
  if (locRel >= 0) {
    const eocd64Off = u64(tail, locRel + 8);
    const e64 = await source.slice(eocd64Off, eocd64Off + 56);
    if (findSeq(e64, SIG_EOCD64, 0, false) === 0) {
      cdCount = u64(e64, 32);
      cdSize = u64(e64, 40);
      cdOffset = u64(e64, 48);
    }
  }

  const cd = await source.slice(cdOffset, cdOffset + cdSize);
  const entries = [];
  let p = 0;
  for (let i = 0; i < cdCount && p + 46 <= cd.length; i++) {
    if (u32(cd, p) !== 0x02014b50) break;
    const flags = u16(cd, p + 8);
    const method = u16(cd, p + 10);
    const crc = u32(cd, p + 16);
    let compSize = u32(cd, p + 20);
    let uncompSize = u32(cd, p + 24);
    const nameLen = u16(cd, p + 28);
    const extraLen = u16(cd, p + 30);
    const commentLen = u16(cd, p + 32);
    let localOff = u32(cd, p + 42);
    const nameBytes = cd.subarray(p + 46, p + 46 + nameLen);
    const name = decodeName(nameBytes, !!(flags & 0x800));

    // ZIP64 extra (0x0001) — переопределяет размеры/смещение
    let ep = p + 46 + nameLen;
    const extraEnd = ep + extraLen;
    while (ep + 4 <= extraEnd) {
      const hid = u16(cd, ep), hsz = u16(cd, ep + 2);
      if (hid === 0x0001) {
        let q = ep + 4;
        if (uncompSize === 0xffffffff && q + 8 <= ep + 4 + hsz) { uncompSize = u64(cd, q); q += 8; }
        if (compSize === 0xffffffff && q + 8 <= ep + 4 + hsz) { compSize = u64(cd, q); q += 8; }
        if (localOff === 0xffffffff && q + 8 <= ep + 4 + hsz) { localOff = u64(cd, q); q += 8; }
        break;
      }
      ep += 4 + hsz;
    }

    entries.push({
      name: name,
      isDir: name.endsWith('/') || name.endsWith('\\'),
      method: method,
      crc: crc,
      compSize: compSize,
      size: uncompSize,
      localOff: localOff,
      _dataStart: -1
    });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return { source: source, entries: entries };
}

async function entryDataStart(zip, entry) {
  if (entry._dataStart >= 0) return entry._dataStart;
  const lh = await zip.source.slice(entry.localOff, entry.localOff + 30);
  if (u32(lh, 0) !== 0x04034b50) throw new Error('Повреждён локальный заголовок: ' + entry.name);
  entry._dataStart = entry.localOff + 30 + u16(lh, 26) + u16(lh, 28);
  return entry._dataStart;
}

async function zipRead(zip, entry) {
  const start = await entryDataStart(zip, entry);
  const raw = await zip.source.slice(start, start + entry.compSize);
  if (entry.method === 0) return raw;
  if (entry.method === 8) return inflateRaw(raw);
  throw new Error('Неподдерживаемый метод сжатия ' + entry.method + ' в ' + entry.name);
}

/* «Голова» и «хвост» распакованных данных записи — без чтения всего файла. */
async function zipReadHeadTail(zip, entry, headCap, tailCap) {
  const start = await entryDataStart(zip, entry);
  if (entry.method === 0) {
    if (entry.size <= headCap + tailCap) {
      const all = await zip.source.slice(start, start + entry.size);
      return { head: all, tail: all, whole: true };
    }
    return {
      head: await zip.source.slice(start, start + headCap),
      tail: await zip.source.slice(start + entry.size - tailCap, start + entry.size),
      whole: false
    };
  }
  if (entry.method !== 8) throw new Error('Неподдерживаемый метод сжатия ' + entry.method);
  const r = await inflateRawHeadTail(zip.source, start, entry.compSize, headCap, tailCap);
  return { head: r.head, tail: r.tail, whole: r.totalOut <= headCap };
}

/* ──────────────────────────── ZIP: запись ─────────────────────────────── */

const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes, seed) {
  let c = (seed === undefined ? 0 : seed) ^ 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function w16(a, v) { a.push(v & 0xff, (v >>> 8) & 0xff); }
function w32(a, v) { a.push(v & 0xff, (v >>> 8) & 0xff, (v >>> 16) & 0xff, (v >>> 24) & 0xff); }

/* Собирает ZIP (метод STORED) из [{name, bytes|blob, crc?, size?}].
   Возвращает Blob. Данные держим как Blob-части, чтобы не копить всё в памяти. */
function zipWrite(files) {
  const parts = [];
  const central = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = encodeUtf8(f.name);
    const size = f.size !== undefined ? f.size : f.bytes.length;
    const crc = f.crc !== undefined ? f.crc : crc32(f.bytes);

    const lh = [];
    w32(lh, 0x04034b50);
    w16(lh, 20);          // version needed
    w16(lh, 0x0800);      // флаг UTF-8 в имени
    w16(lh, 0);           // STORED
    w16(lh, 0); w16(lh, 0); // время/дата
    w32(lh, crc); w32(lh, size); w32(lh, size);
    w16(lh, nameBytes.length); w16(lh, 0);
    const lhBytes = new Uint8Array(lh);

    parts.push(lhBytes, nameBytes, f.blob || f.bytes);

    const cd = [];
    w32(cd, 0x02014b50);
    w16(cd, 20); w16(cd, 20);
    w16(cd, 0x0800); w16(cd, 0);
    w16(cd, 0); w16(cd, 0);
    w32(cd, crc); w32(cd, size); w32(cd, size);
    w16(cd, nameBytes.length); w16(cd, 0); w16(cd, 0);
    w16(cd, 0); w16(cd, 0); w32(cd, 0);
    w32(cd, offset);
    central.push(new Uint8Array(cd), nameBytes);

    offset += lhBytes.length + nameBytes.length + size;
  }

  let cdSize = 0;
  for (const c of central) cdSize += c.length;

  const eocd = [];
  w32(eocd, 0x06054b50);
  w16(eocd, 0); w16(eocd, 0);
  w16(eocd, files.length); w16(eocd, files.length);
  w32(eocd, cdSize); w32(eocd, offset);
  w16(eocd, 0);

  return new Blob(parts.concat(central, [new Uint8Array(eocd)]), { type: 'application/zip' });
}

/* Симметрично inflateRaw — штатный CompressionStream, тот же 'deflate-raw'. */
async function deflateRaw(bytes) {
  const cs = new CompressionStream('deflate-raw');
  const w = cs.writable.getWriter();
  w.write(bytes); w.close();
  const parts = [];
  let total = 0;
  const r = cs.readable.getReader();
  for (;;) {
    const { done, value } = await r.read();
    if (done) break;
    parts.push(value); total += value.length;
  }
  const out = new Uint8Array(total);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

/* Та же запись zip, что и zipWrite, но каждая запись — DEFLATE, а не STORED.
   Асинхронно (CompressionStream — потоковый API); для по-настоящему больших
   файлов (сотни тысяч строк текста) сжатие даёт разы, а не проценты — XML
   этого вида (много повторяющихся тегов/значений) на этом и держится. */
async function zipWriteDeflate(files, onProgress) {
  const parts = [];
  const central = [];
  let offset = 0;
  let i = 0;

  for (const f of files) {
    const nameBytes = encodeUtf8(f.name);
    const rawBytes = f.blob || f.bytes;
    const size = f.size !== undefined ? f.size : rawBytes.length;
    const crc = f.crc !== undefined ? f.crc : crc32(rawBytes);
    const compBytes = await deflateRaw(rawBytes);
    i++;
    if (onProgress) onProgress(i, files.length, f.name);

    const lh = [];
    w32(lh, 0x04034b50);
    w16(lh, 20);
    w16(lh, 0x0800);
    w16(lh, 8);            // DEFLATE
    w16(lh, 0); w16(lh, 0);
    w32(lh, crc); w32(lh, compBytes.length); w32(lh, size);
    w16(lh, nameBytes.length); w16(lh, 0);
    const lhBytes = new Uint8Array(lh);
    parts.push(lhBytes, nameBytes, compBytes);

    const cd = [];
    w32(cd, 0x02014b50);
    w16(cd, 20); w16(cd, 20);
    w16(cd, 0x0800); w16(cd, 8);
    w16(cd, 0); w16(cd, 0);
    w32(cd, crc); w32(cd, compBytes.length); w32(cd, size);
    w16(cd, nameBytes.length); w16(cd, 0); w16(cd, 0);
    w16(cd, 0); w16(cd, 0); w32(cd, 0);
    w32(cd, offset);
    central.push(new Uint8Array(cd), nameBytes);

    offset += lhBytes.length + nameBytes.length + compBytes.length;
  }

  let cdSize = 0;
  for (const c of central) cdSize += c.length;

  const eocd = [];
  w32(eocd, 0x06054b50);
  w16(eocd, 0); w16(eocd, 0);
  w16(eocd, files.length); w16(eocd, files.length);
  w32(eocd, cdSize); w32(eocd, offset);
  w16(eocd, 0);

  return new Blob(parts.concat(central, [new Uint8Array(eocd)]), { type: 'application/zip' });
}

/* ─────────────────────── размеры видео из MP4/MOV ─────────────────────── */

const CONTAINER_BOXES = new Set(['moov', 'trak', 'mdia', 'minf', 'stbl', 'edts', 'udta']);
const AUDIO_FOURCC = new Set(['mp4a', 'ac-3', 'ec-3', 'alac', 'Opus', 'sowt', 'twos', 'ulaw',
  'alaw', '.mp3', 'samr', 'sawb', 'dtsc', 'dtse', 'dtsh', 'dtsl', 'fLaC']);

function fourcc(b, o) {
  return String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]);
}

function* iterBoxes(b, start, end) {
  let pos = start;
  while (pos + 8 <= end) {
    let size = u32be(b, pos);
    const type = fourcc(b, pos + 4);
    let header = 8;
    if (size === 1) {
      if (pos + 16 > end) break;
      size = u64be(b, pos + 8);
      header = 16;
    } else if (size === 0) {
      size = end - pos;
    }
    if (size < header || pos + size > end) break;
    yield [type, pos + header, pos + size];
    pos += size;
  }
}
function u32be(b, o) { return ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0; }
function u16be(b, o) { return (b[o] << 8) | b[o + 1]; }
function u64be(b, o) { return u32be(b, o) * 4294967296 + u32be(b, o + 4); }

/* Структурный разбор — как в match_creatives.py (_find_stsd_dims). */
function findStsdDims(b, start, end) {
  for (const [type, bs, be] of iterBoxes(b, start, end)) {
    if (type === 'stsd') {
      const p = bs + 8; // version+flags + entry_count
      for (const [etype, es, ee] of iterBoxes(b, p, be)) {
        if (ee - es >= 28) {
          const w = u16be(b, es + 24), h = u16be(b, es + 26);
          if (w && h) return [w, h];
        }
      }
    } else if (CONTAINER_BOXES.has(type)) {
      const r = findStsdDims(b, bs, be);
      if (r) return r;
    }
  }
  return null;
}

/* Резервный путь: буфер начинается «посреди» файла (хвост большого видео),
   структуру от нуля не пройти — ищем маркер stsd напрямую. */
function scanStsdDims(b) {
  const SEQ = [0x73, 0x74, 0x73, 0x64]; // 'stsd'
  let from = 0;
  for (;;) {
    const i = findSeq(b, SEQ, from, false);
    if (i < 0) return null;
    from = i + 1;
    const entry = i + 12;              // размер(4)+тип(4) → +version/flags(4)+count(4)
    if (entry + 40 > b.length) continue;
    const etype = fourcc(b, entry + 4);
    if (AUDIO_FOURCC.has(etype)) continue;
    const w = u16be(b, entry + 32), h = u16be(b, entry + 34);
    if (w > 0 && h > 0 && w <= 16384 && h <= 16384) return [w, h];
  }
}

function dimsFromHeadTail(head, tail, whole) {
  let d = null;
  try { d = findStsdDims(head, 0, head.length); } catch (e) { d = null; }
  if (d) return d;
  if (!whole && tail && tail.length) {
    try { d = scanStsdDims(tail); } catch (e) { d = null; }
    if (d) return d;
  }
  if (!d) { try { d = scanStsdDims(head); } catch (e) { d = null; } }
  return d;
}

/* ───────────────────────────── XML утилиты ────────────────────────────── */

function unescapeXml(s) {
  if (s.indexOf('&') < 0) return s;
  return s.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g, function (m, g) {
    switch (g) {
      case 'amp': return '&';
      case 'lt': return '<';
      case 'gt': return '>';
      case 'quot': return '"';
      case 'apos': return "'";
      default:
        return g[1] === 'x' || g[1] === 'X'
          ? String.fromCodePoint(parseInt(g.slice(2), 16))
          : String.fromCodePoint(parseInt(g.slice(1), 10));
    }
  });
}

function escapeXml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c];
  // eslint-disable-next-line no-control-regex
  }).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
}

/* JS Date → серийный номер даты Excel (дней с 1899-12-30, тот самый
   исторический баг с несуществующим 29 февраля 1900 — Excel считает так
   всегда, и это учтено самой точкой отсчёта). Даты собираются и здесь, и на
   входе одинаково через локальный конструктор Date(y, m, d) — разница часовых
   поясов и переходов на летнее время при этом взаимно гасится. */
function dateToSerial(d) {
  const epoch = new Date(1899, 11, 30);
  return Math.round((d.getTime() - epoch.getTime()) / 86400000);
}

/* ──────────────────────────── XLSX: чтение ────────────────────────────── */

function colToIndex(ref) { // 'BC12' -> 54 (0-based)
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c >= 65 && c <= 90) n = n * 26 + (c - 64);
    else if (c >= 97 && c <= 122) n = n * 26 + (c - 96);
    else break;
  }
  return n - 1;
}

function parseSharedStrings(xml) {
  const out = [];
  const siRe = /<si\b[^>]*>([\s\S]*?)<\/si>|<si\b[^>]*\/>/g;
  let m;
  while ((m = siRe.exec(xml))) {
    const inner = m[1] || '';
    let text = '';
    const tRe = /<t\b[^>]*>([\s\S]*?)<\/t>|<t\b[^>]*\/>/g;
    let t;
    while ((t = tRe.exec(inner))) text += unescapeXml(t[1] || '');
    out.push(text);
  }
  return out;
}

function parseSheetXml(xml, shared) {
  const rows = [];
  /* Группа атрибутов — ЛЕНИВАЯ ([^>]*?), не жадная. С жадной версией
     самозакрывающийся элемент (напр. пустая <c t="inlineStr"/> — Excel так
     пишет непустую по стилю, но безо всякого значения ячейку) на некоторых
     файлах склеивался со СЛЕДУЮЩИМ элементом: движок сначала жадно съедал
     атрибуты вплотную до конца "/>", альтернатива "\/>" не находила '/' на
     новой позиции и отваливалась, а вторая альтернатива ">...</row>" охотно
     дотягивалась до ЧУЖОГО закрывающего тега. В результате одна строка/ячейка
     пропадала, а следующая получала не своё содержимое — без единой ошибки
     в консоли. Поймано на реальном 37-тысячестрочном инвентаре: часть строк
     сдвигалась на одну ячейку. */
  const rowRe = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
  let rm;
  while ((rm = rowRe.exec(xml))) {
    const attrs = rm[1] || '';
    const body = rm[2] || '';
    const rAttr = /\br="(\d+)"/.exec(attrs);
    const rowIdx = rAttr ? parseInt(rAttr[1], 10) - 1 : rows.length;
    const cells = [];
    const cRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let cm, autoCol = 0;
    while ((cm = cRe.exec(body))) {
      const cAttrs = cm[1] || '';
      const cBody = cm[2] || '';
      const refM = /\br="([A-Za-z]+\d+)"/.exec(cAttrs);
      const col = refM ? colToIndex(refM[1]) : autoCol;
      autoCol = col + 1;
      const tM = /\bt="([^"]+)"/.exec(cAttrs);
      const type = tM ? tM[1] : 'n';
      let val = null;
      if (type === 'inlineStr') {
        let text = '';
        const tRe = /<t\b[^>]*>([\s\S]*?)<\/t>|<t\b[^>]*\/>/g;
        let t;
        while ((t = tRe.exec(cBody))) text += unescapeXml(t[1] || '');
        val = text;
      } else {
        const vM = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(cBody);
        const raw = vM ? unescapeXml(vM[1]) : null;
        if (raw === null || raw === '') val = null;
        else if (type === 's') val = shared[parseInt(raw, 10)];
        else if (type === 'str' || type === 'e') val = raw;
        else if (type === 'b') val = raw === '1';
        else { const num = Number(raw); val = isNaN(num) ? raw : num; }
      }
      cells[col] = val === undefined ? null : val;
    }
    for (let i = 0; i < cells.length; i++) if (cells[i] === undefined) cells[i] = null;
    rows[rowIdx] = cells;
  }
  for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
  return rows;
}

/* Читает xlsx → { sheets: [{name, rows}] }. rows — массив массивов ячеек. */
async function readXlsx(source) {
  const zip = await zipOpen(source);
  const byName = {};
  for (const e of zip.entries) if (!e.isDir) byName[e.name.replace(/^\/+/, '')] = e;

  async function text(name) {
    const e = byName[name];
    if (!e) return null;
    return utf8Loose.decode(await zipRead(zip, e));
  }

  const wbXml = await text('xl/workbook.xml');
  if (!wbXml) throw new Error('Это не файл .xlsx (нет xl/workbook.xml)');
  const relsXml = (await text('xl/_rels/workbook.xml.rels')) || '';

  const rels = {};
  const relRe = /<Relationship\b([^>]*)\/?>/g;
  let rm;
  while ((rm = relRe.exec(relsXml))) {
    const a = rm[1];
    const id = /\bId="([^"]+)"/.exec(a);
    const tgt = /\bTarget="([^"]+)"/.exec(a);
    if (id && tgt) rels[id[1]] = unescapeXml(tgt[1]);
  }

  let shared = [];
  const ssXml = await text('xl/sharedStrings.xml');
  if (ssXml) shared = parseSharedStrings(ssXml);

  const sheets = [];
  const shRe = /<sheet\b([^>]*)\/?>/g;
  let sm;
  while ((sm = shRe.exec(wbXml))) {
    const a = sm[1];
    const nameM = /\bname="([^"]*)"/.exec(a);
    const ridM = /\br:id="([^"]+)"/.exec(a) || /\bid="([^"]+)"/.exec(a);
    const name = nameM ? unescapeXml(nameM[1]) : 'Sheet' + (sheets.length + 1);
    let target = ridM ? rels[ridM[1]] : null;
    if (!target) target = 'worksheets/sheet' + (sheets.length + 1) + '.xml';
    let path = target.replace(/^\/+/, '');
    if (!/^xl\//.test(path)) path = 'xl/' + path;
    const xml = await text(path);
    sheets.push({ name: name, rows: xml ? parseSheetXml(xml, shared) : [] });
  }
  return { sheets: sheets };
}

/* ──────────────────────────── XLSX: запись ────────────────────────────── */
/* Стили (индексы cellXfs):
     0 обычный · 1 шапка · 2 тело · 3 тело-красное · 4 тело-зелёное
     5 гиперссылка · 6 число 0.000000                                        */

const STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
'<numFmts count="4">' +
  '<numFmt numFmtId="164" formatCode="0.000000"/>' +
  '<numFmt numFmtId="165" formatCode="dd.mm.yyyy"/>' +
  '<numFmt numFmtId="166" formatCode="#,##0.00"/>' +
  '<numFmt numFmtId="167" formatCode="#,##0"/>' +
'</numFmts>' +
'<fonts count="5">' +
  '<font><sz val="10"/><name val="Arial"/></font>' +
  '<font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font>' +
  '<font><u/><sz val="10"/><color rgb="FF0563C1"/><name val="Arial"/></font>' +
  '<font><sz val="10"/><name val="Arial"/></font>' +
  '<font><b/><sz val="10"/><name val="Arial"/></font>' +
'</fonts>' +
'<fills count="6">' +
  '<fill><patternFill patternType="none"/></fill>' +
  '<fill><patternFill patternType="gray125"/></fill>' +
  '<fill><patternFill patternType="solid"><fgColor rgb="FF2F3B52"/><bgColor indexed="64"/></patternFill></fill>' +
  '<fill><patternFill patternType="solid"><fgColor rgb="FFFCE4E4"/><bgColor indexed="64"/></patternFill></fill>' +
  '<fill><patternFill patternType="solid"><fgColor rgb="FFE7F4E4"/><bgColor indexed="64"/></patternFill></fill>' +
  '<fill><patternFill patternType="solid"><fgColor rgb="FFF2F2F2"/><bgColor indexed="64"/></patternFill></fill>' +
'</fills>' +
'<borders count="2">' +
  '<border><left/><right/><top/><bottom/><diagonal/></border>' +
  '<border><left style="thin"><color rgb="FFD0D0D0"/></left><right style="thin"><color rgb="FFD0D0D0"/></right>' +
  '<top style="thin"><color rgb="FFD0D0D0"/></top><bottom style="thin"><color rgb="FFD0D0D0"/></bottom><diagonal/></border>' +
'</borders>' +
'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
'<cellXfs count="12">' +
  '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
  '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
  '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
  '<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
  '<xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
  '<xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
  '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
  '<xf numFmtId="0" fontId="4" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
  '<xf numFmtId="165" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
  '<xf numFmtId="0" fontId="4" fillId="5" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
  '<xf numFmtId="166" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
  '<xf numFmtId="167" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
'</cellXfs>' +
'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
'</styleSheet>';

const S = { PLAIN: 0, HEADER: 1, BODY: 2, WARN: 3, OK: 4, LINK: 5, NUM6: 6, GROUP: 7,
  DATE: 8, CITYHDR: 9, MONEY: 10, INT: 11 };

function indexToCol(i) {
  let s = '';
  i += 1;
  while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

/* Лист: { name, cols:[ширины], freeze:true, outlineSummaryAbove:true,
     rows:[ [ {v,s,link} | значение ] | {cells:[...], outlineLevel, hidden, collapsed} ] } */
function sheetToXml(sheet) {
  const hyperlinks = [];
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
    ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';

  // Раскрывающиеся группы строк (Excel outline): по умолчанию сводная
  // строка — НИЖЕ деталей (обычный Excel-стиль «итого под данными»). Наши
  // отчёты кладут заголовок группы НАД операторами, поэтому переключаем.
  if (sheet.outlineSummaryAbove) {
    x += '<sheetPr><outlinePr summaryBelow="0"/></sheetPr>';
  }

  x += '<sheetViews><sheetView workbookViewId="0">';
  if (sheet.freeze !== false) {
    x += '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>';
  }
  x += '</sheetView></sheetViews>';

  if (sheet.cols && sheet.cols.length) {
    x += '<cols>';
    sheet.cols.forEach(function (w, i) {
      x += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
    });
    x += '</cols>';
  }

  x += '<sheetData>';
  sheet.rows.forEach(function (rowOrGroup, ri) {
    const rn = ri + 1;
    const isGroup = rowOrGroup && !Array.isArray(rowOrGroup);
    const row = isGroup ? (rowOrGroup.cells || []) : rowOrGroup;
    let attrs = '';
    if (isGroup) {
      if (rowOrGroup.outlineLevel) attrs += ' outlineLevel="' + rowOrGroup.outlineLevel + '"';
      if (rowOrGroup.hidden) attrs += ' hidden="1"';
      if (rowOrGroup.collapsed) attrs += ' collapsed="1"';
    }
    x += '<row r="' + rn + '"' + (ri === 0 ? ' ht="30" customHeight="1"' : '') + attrs + '>';
    row.forEach(function (cell, ci) {
      if (cell === null || cell === undefined) return;
      const obj = (typeof cell === 'object' && cell !== null && !(cell instanceof Date)) ? cell : { v: cell };
      let v = obj.v;
      if (v === null || v === undefined || v === '') {
        if (obj.s === undefined) return;
        v = '';
      }
      const ref = indexToCol(ci) + rn;
      const st = obj.s === undefined ? (ri === 0 ? S.HEADER : S.BODY) : obj.s;
      if (obj.link) hyperlinks.push({ ref: ref, url: obj.link });
      if (v instanceof Date) {
        x += '<c r="' + ref + '" s="' + st + '"><v>' + dateToSerial(v) + '</v></c>';
      } else if (typeof v === 'number' && isFinite(v)) {
        x += '<c r="' + ref + '" s="' + st + '"><v>' + v + '</v></c>';
      } else if (typeof v === 'boolean') {
        x += '<c r="' + ref + '" s="' + st + '" t="b"><v>' + (v ? 1 : 0) + '</v></c>';
      } else {
        x += '<c r="' + ref + '" s="' + st + '" t="inlineStr"><is><t xml:space="preserve">' +
          escapeXml(v) + '</t></is></c>';
      }
    });
    x += '</row>';
  });
  x += '</sheetData>';

  if (hyperlinks.length) {
    x += '<hyperlinks>';
    hyperlinks.forEach(function (h, i) {
      x += '<hyperlink ref="' + h.ref + '" r:id="rId' + (i + 1) + '"/>';
    });
    x += '</hyperlinks>';
  }
  x += '</worksheet>';
  return { xml: x, hyperlinks: hyperlinks };
}

/* sheets: [{name, cols, freeze, rows}] → список файлов пакета xlsx
   (общее для writeXlsx и writeXlsxDeflate — отличаются только тем, как
   потом упаковывается zip: STORED или DEFLATE). */
function buildXlsxFiles(sheets) {
  const files = [];
  const add = function (name, str) { files.push({ name: name, bytes: encodeUtf8(str) }); };

  let ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
  sheets.forEach(function (s, i) {
    ct += '<Override PartName="/xl/worksheets/sheet' + (i + 1) +
      '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
  });
  ct += '</Types>';
  add('[Content_Types].xml', ct);

  add('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>');

  let wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
    ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  sheets.forEach(function (s, i) {
    wb += '<sheet name="' + escapeXml(String(s.name).slice(0, 31).replace(/[\\/*?:[\]]/g, '_')) +
      '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
  });
  wb += '</sheets></workbook>';
  add('xl/workbook.xml', wb);

  let wbr = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  sheets.forEach(function (s, i) {
    wbr += '<Relationship Id="rId' + (i + 1) +
      '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' +
      (i + 1) + '.xml"/>';
  });
  wbr += '<Relationship Id="rId' + (sheets.length + 1) +
    '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
  wbr += '</Relationships>';
  add('xl/_rels/workbook.xml.rels', wbr);

  add('xl/styles.xml', STYLES_XML);

  sheets.forEach(function (s, i) {
    const r = sheetToXml(s);
    add('xl/worksheets/sheet' + (i + 1) + '.xml', r.xml);
    if (r.hyperlinks.length) {
      let rl = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
      r.hyperlinks.forEach(function (h, j) {
        rl += '<Relationship Id="rId' + (j + 1) +
          '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' +
          escapeXml(h.url) + '" TargetMode="External"/>';
      });
      rl += '</Relationships>';
      add('xl/worksheets/_rels/sheet' + (i + 1) + '.xml.rels', rl);
    }
  });

  return files;
}

/* sheets → Blob (.xlsx), ZIP без сжатия (STORED) — быстро, но крупные отчёты
   (сотни тысяч строк) выходят раздутыми: XML-текст сжимается в разы, а тут
   он идёт как есть. Годится для отчётов на тысячи строк — как и раньше. */
function writeXlsx(sheets) {
  const blob = zipWrite(buildXlsxFiles(sheets));
  return new Blob([blob], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* То же самое, но ZIP-запись через DEFLATE (штатный CompressionStream —
   симметрично inflateRaw/DecompressionStream, которым читаются архивы).
   Нужно только там, где иначе файл выходит непригодным для скачивания —
   отчёт MasterAd на 250 000+ строк без сжатия весит под 500 МБ, со сжатием —

<script>
/* ============================================================================
   Сбор технических требований — логика (порт tt.py, версия 4.4).
   Зависит от OmniLib и TTData.
   ========================================================================== */
(function (root) {
'use strict';

const L = root.OmniLib;
const D = root.TTData;

const norm = L.normName;

/* Предрассчитанные нормализованные индексы (как в tt.py) */
const ALIAS_NORM = {};
for (const k in D.OPERATOR_ALIASES) ALIAS_NORM[norm(k)] = D.OPERATOR_ALIASES[k];

const RUSS_OPERATORS = new Set(D.RUSS_OPERATORS);
const RUSS_10SEC_FORMATS = new Set(D.RUSS_10SEC_FORMATS);
const MAER_OUTDOOR_OPERATORS = new Set(D.MAER_OUTDOOR_OPERATORS);
const FLAT_DURATIONS = D.FLAT_DURATIONS;

/* Ключ Map — «оператор + формат». Склеиваем через NUL: такого символа нет
   ни в названиях операторов, ни в кодах форматов, поэтому разные пары
   не могут дать одинаковый ключ (в tt.py ключом служил кортеж). */
const KEY_SEP = '\u0000';

const DURATIONS_NORM = new Map();
for (const [op, fmt, d] of D.INVENTORY_DURATIONS) DURATIONS_NORM.set(norm(op) + KEY_SEP + fmt, d);

/* Формат из АП → код таблицы: верхний регистр, пробелы/дефисы → '_'. */
function normFormat(fmt) {
  let f = String(fmt === null || fmt === undefined ? '' : fmt).trim().toUpperCase().replace(/\s+/g, '_');
  f = f.replace(/-/g, '_');
  return f.replace(/_+/g, '_');
}

/* Длительность (сек) или null. Приоритет: Русс → MAER (Outdoor) → фикс. → словарь. */
function lookupDuration(operator, screenFormat) {
  const op = norm(operator);
  const fmt = normFormat(screenFormat);

  if (RUSS_OPERATORS.has(op)) return RUSS_10SEC_FORMATS.has(fmt) ? 10 : 5;
  if (MAER_OUTDOOR_OPERATORS.has(op)) return fmt === 'MEDIAFACADE' ? 10 : 5;
  if (Object.prototype.hasOwnProperty.call(FLAT_DURATIONS, op)) return FLAT_DURATIONS[op];

  const v = DURATIONS_NORM.get(op + KEY_SEP + fmt);
  return v === undefined ? null : v;
}

/* Колонки с длительностью в самой АП: «Длительность», «Длительность, с»,
   «Длительность ролика» — что найдётся. АП главнее справочника: там цифра
   от оператора на эту закупку, а справочник — наша память о том, что он
   обычно даёт. */
function durationCols(table) {
  const cols = [];
  for (const name in table.colOf) if (/длительн/i.test(name)) cols.push(table.colOf[name]);
  return cols;
}

/* «5», «5 с», «5, 10», «10/15» → [5, 10] (по возрастанию, без повторов).
   Запятая тут всегда разделитель, а не дробная часть: секунды целые. */
function parseDurations(v) {
  const out = [];
  const found = String(v === null || v === undefined ? '' : v).match(/\d+(?:\.\d+)?/g) || [];
  for (const s of found) {
    const n = Number(s);
    if (n > 0 && out.indexOf(n) < 0) out.push(n);
  }
  return out.sort(function (a, b) { return a - b; });
}

/* Одна длительность остаётся числом (в xlsx — числом), несколько — «5, 10». */
function joinDurations(list) {
  return list.length === 1 ? list[0] : list.join(', ');
}

/* Имя оператора из АП → нормализованный токен имени файла на Диске. */
function operatorToken(apOperator) {
  const n = norm(apOperator);
  const token = Object.prototype.hasOwnProperty.call(ALIAS_NORM, n) ? ALIAS_NORM[n] : apOperator;
  return norm(token);
}

/* Имя файла → [оператор_норм, разрешение, соотношение, признак_общего]. */
function parseFilename(name) {
  const base = String(name).replace(/\.[^.]*$/, '').trim();

  const resM = /\d+\s*[xхXХ×]\s*\d+/.exec(base);
  const aspM = /\d+\s*:\s*\d+/.exec(base);
  const obshM = /общее/i.exec(base);

  const cands = [resM, aspM, obshM].filter(Boolean);
  let operator;
  if (cands.length) {
    const cut = Math.min.apply(null, cands.map(function (m) { return m.index; }));
    operator = base.slice(0, cut).trim();
  } else {
    operator = base;   // напр. «Инсайт», «Санлайт» — общий файл без суффикса
  }

  return [
    norm(operator),
    resM ? L.normRes(resM[0]) : null,
    aspM ? L.normAspect(aspM[0]) : null,
    !!obshM || cands.length === 0
  ];
}

/* ─────────────── индекс ссылок публичной папки Яндекс.Диска ─────────────── */

const YA_API = 'https://cloud-api.yandex.net/v1/disk/public/resources';

class YandexDiskLinker {
  constructor(publicKey) {
    this.publicKey = publicKey;
    this.index = new Map();     // 'res|op|1920x1080' → ссылка
    this.files = [];
    this.unpublished = [];
    this.dirsSeen = 0;
    this.apiCalls = 0;
    this.ok = false;
  }

  async fetchAll(onProgress) {
    this.apiCalls = 0;
    this.dirsSeen = 0;
    const files = await this._walk('/', 0, 12, 400, onProgress);
    this.files = files;

    for (const it of files) {
      const link = it.public_url || '';
      const [op, res, asp, isObsh] = parseFilename(it.name || '');
      if (!link) { this.unpublished.push(it.name || ''); continue; }
      if (res) this.index.set('res|' + op + '|' + res, link);
      if (asp) this.index.set('asp|' + op + '|' + asp, link);
      if (isObsh) this.index.set('obsh|' + op, link);
    }
    this.ok = true;
    return this;
  }

  async _walk(path, depth, maxDepth, maxCalls, onProgress) {
    const collected = [];
    let offset = 0;
    const limit = 200;
    for (;;) {
      if (this.apiCalls >= maxCalls) break;
      const url = YA_API + '?public_key=' + encodeURIComponent(this.publicKey) +
        '&limit=' + limit + '&offset=' + offset +
        (path && path !== '/' ? '&path=' + encodeURIComponent(path) : '');
      const r = await fetch(url);
      this.apiCalls++;
      if (!r.ok) throw new Error('Яндекс.Диск ответил ' + r.status + ' ' + r.statusText);
      const j = await r.json();
      const emb = j._embedded || {};
      const items = emb.items || [];
      const total = emb.total === undefined ? items.length : emb.total;
      collected.push.apply(collected, items);
      if (onProgress) onProgress(collected.length, total, path);
      offset += limit;
      if (offset >= total || !items.length) break;
    }

    const files = collected.filter(function (it) { return it.type === 'file'; });
    const dirs = collected.filter(function (it) { return it.type === 'dir'; });
    if (depth < maxDepth) {
      for (const d of dirs) {
        this.dirsSeen++;
        if (d.path) {
          const sub = await this._walk(d.path, depth + 1, maxDepth, maxCalls, onProgress);
          files.push.apply(files, sub);
        }
      }
    }
    return files;
  }

  /* Подбор ссылки: разрешение → соотношение → общее. */
  findLink(apOperator, resolution, aspect) {
    const op = operatorToken(apOperator);
    const res = L.normRes(resolution);
    const asp = L.normAspect(aspect);
    if (res && this.index.has('res|' + op + '|' + res)) return this.index.get('res|' + op + '|' + res);
    if (asp && this.index.has('asp|' + op + '|' + asp)) return this.index.get('asp|' + op + '|' + asp);
    if (this.index.has('obsh|' + op)) return this.index.get('obsh|' + op);
    return '';
  }
}

/* ─────────────────────── чтение адресной программы ─────────────────────── */

const AP_SIGNALS = new Set(['Оператор', 'Формат экрана', 'Разрешение', 'Вид. разрешение',
  'Соотношение сторон', 'GID']);

/* Ищет строку-шапку: где есть «Оператор» и больше всего знакомых колонок. */
function findHeader(rows, maxScan) {
  let bestIdx = null, bestScore = 0;
  const n = Math.min(rows.length, maxScan || 60);
  for (let i = 0; i < n; i++) {
    const cells = new Set();
    for (const v of (rows[i] || [])) {
      const s = L.cellStr(v);
      if (s) cells.add(s);
    }
    if (!cells.has('Оператор')) continue;
    let score = 0;
    for (const c of cells) if (AP_SIGNALS.has(c)) score++;
    if (score > bestScore) { bestScore = score; bestIdx = i; }
  }
  return bestScore >= 2 ? { idx: bestIdx, score: bestScore } : { idx: null, score: 0 };
}

/* Находит таблицу АП на любом листе и в любой строке (как read_ap_data в tt.py). */
function findApTable(workbook) {
  let best = null;
  for (const sheet of workbook.sheets) {
    if (!sheet.rows.length) continue;
    const h = findHeader(sheet.rows);
    if (h.idx === null) continue;
    const nRows = sheet.rows.length - h.idx - 1;
    if (!best || h.score > best.score || (h.score === best.score && nRows > best.nRows)) {
      best = { score: h.score, nRows: nRows, sheet: sheet, headerIdx: h.idx };
    }
  }
  if (!best) return null;

  const header = (best.sheet.rows[best.headerIdx] || []).map(L.cellStr);
  const colOf = {};
  header.forEach(function (name, i) {
    if (name && !(name in colOf)) colOf[name] = i;   // первое вхождение, как в pandas
  });

  const data = [];
  for (let i = best.headerIdx + 1; i < best.sheet.rows.length; i++) {
    const row = best.sheet.rows[i] || [];
    let allEmpty = true;
    for (const v of row) if (v !== null && v !== undefined && v !== '') { allEmpty = false; break; }
    if (allEmpty) continue;                          // dropna(how='all')
    data.push(row);
  }

  return {
    sheetName: best.sheet.name,
    headerRow: best.headerIdx + 1,
    colOf: colOf,
    rows: data
  };
}

/* Значение по первому подходящему имени столбца (аналог get_field). */
function getField(table, row, names) {
  for (const n of names) {
    if (n in table.colOf) {
      const v = row[table.colOf[n]];
      if (v !== null && v !== undefined && v !== '') return v;
    }
  }
  return '';
}

/* Обработка всех строк АП → { results, durationMisses } */
function processAp(table, linker) {
  const results = [];
  const durationMisses = new Set();
  const durCols = durationCols(table);

  for (const row of table.rows) {
    const operator = getField(table, row, ['Оператор']);
    const screenFormat = getField(table, row, ['Формат экрана']);
    const resolution = getField(table, row, ['Разрешение', 'Вид. разрешение']);
    const aspect = getField(table, row, ['Соотношение сторон']);

    const apDurs = [];
    for (const c of durCols) {
      for (const n of parseDurations(row[c])) if (apDurs.indexOf(n) < 0) apDurs.push(n);
    }
    apDurs.sort(function (a, b) { return a - b; });

    let dur;
    if (apDurs.length) {
      dur = joinDurations(apDurs);
    } else {
      dur = lookupDuration(operator, screenFormat);
      if (dur === null) {
        durationMisses.add(L.cellStr(operator) + ' | ' + L.cellStr(screenFormat));
        dur = '';
      }
    }

    results.push({
      'Оператор': L.cellStr(operator),
      'Формат экрана': L.cellStr(screenFormat),
      'Разрешение': L.cellStr(resolution),
      'Соотношение сторон': L.cellStr(aspect),
      'Длительность (сек)': dur,
      'Ссылка на ТТ': linker ? linker.findLink(operator, resolution, aspect) : '',
      _apDur: apDurs.length > 0
    });
  }

  return { results: results, durationMisses: durationMisses };
}

/* Дедупликация по (оператор, разрешение, длительность) — как в tt.py.
   Длительности из АП — исключение: на одну связку их может быть несколько
   (и 5, и 10 секунд у того же оператора), и нужны все — склеиваем через запятую. */
function deduplicate(results) {
  const byKey = new Map();
  for (const r of results) {
    const key = String(r['Оператор']).trim() + KEY_SEP +
                String(r['Разрешение']).trim() + KEY_SEP +
                (r._apDur ? '' : String(r['Длительность (сек)']).trim());
    const prev = byKey.get(key);
    if (!prev) { byKey.set(key, Object.assign({}, r)); continue; }
    if (r._apDur) {
      prev['Длительность (сек)'] = joinDurations(parseDurations(
        String(prev['Длительность (сек)']) + ',' +
        String(r['Длительность (сек)'])));
    }
  }
  return Array.from(byKey.values());
}

const COLUMNS = ['Оператор', 'Формат экрана', 'Разрешение', 'Соотношение сторон',
                 'Длительность (сек)', 'Ссылка на ТТ'];

/* Готовит xlsx-лист «Результаты» с кликабельными ссылками. */
function buildReport(results) {
  const rows = [COLUMNS.slice()];
  for (const r of results) {
    const row = [];
    for (const c of COLUMNS) {
      if (c === 'Ссылка на ТТ') {
        const url = r[c];
        row.push(url
          ? { v: D.LINK_DISPLAY_TEXT || url, s: L.S.LINK, link: url }
          : { v: '', s: L.S.BODY });
      } else {
        row.push(r[c]);
      }
    }
    rows.push(row);
  }
  return [{
    name: 'Результаты',
    cols: [26, 16, 14, 18, 17, 16],
    rows: rows
  }];
}

root.TTCore = {
  normFormat: normFormat,
  lookupDuration: lookupDuration,
  parseDurations: parseDurations,
  joinDurations: joinDurations,
  operatorToken: operatorToken,
  parseFilename: parseFilename,
  YandexDiskLinker: YandexDiskLinker,
  findHeader: findHeader,
  findApTable: findApTable,
  processAp: processAp,

<script>
/* ============================================================================
   Правка видео под ТТ — расчёты.

   Здесь нет ни ffmpeg, ни DOM: только собрать аргументы командной строки,
   разобрать лог ffmpeg и посчитать проценты дисклеймера. Кодирует уже сам
   ffmpeg.wasm в tools/video.html, а эти функции проверяются в node

   чётного сразу, а не ловим потом «width not divisible by 2». */
function even(x) {
  return Math.max(2, Math.round(x / 2) * 2);
}

/* Новое разрешение с сохранением пропорций: вписываем в заданные габариты,
   любой из них можно не задавать. Увеличивать не берёмся — пропорции-то
   сохранятся, а резкость нет, поэтому null: «оставить как есть». */
function scaleTo(srcW, srcH, wantW, wantH) {
  if (!srcW || !srcH) return null;
  let k = 1;
  if (wantW) k = Math.min(k, wantW / srcW);
  if (wantH) k = Math.min(k, wantH / srcH);
  if (k >= 1) return null;
  return { w: even(srcW * k), h: even(srcH * k) };

   в отчёте оператору совсем не так, как «повторится 3 раза». */

  if (!srcDur || !targetDur || targetDur <= srcDur + 0.05) return null;
  const copies = Math.ceil(targetDur / srcDur);
  const lastCut = targetDur - srcDur * (copies - 1);
  return { copies: copies, lastCut: lastCut, whole: Math.abs(lastCut - srcDur) < 0.05 };

  if (loopPlan(o.srcDur, o.targetDur)) a.push('-stream_loop', '-1');
  a.push('-i', o.inName);
  if (o.targetDur) a.push('-t', String(Math.round(o.targetDur * 1000) / 1000));
  if (o.scale) a.push('-vf', 'scale=' + o.scale.w + ':' + o.scale.h);

  a.push('-c:v', 'libx264', '-preset', 'veryfast', '-pix_fmt', 'yuv420p');

       битрейт: одного -b:v мало, он про среднее. */
    a.push('-b:v', o.bitrateK + 'k', '-maxrate', o.bitrateK + 'k',
           '-bufsize', (o.bitrateK * 2) + 'k');

    a.push('-crf', '20');

   больше, чем отдаёт браузерный <video> (битрейт и наличие звука он не знает),
   а лишний проход всё равно нужен — файл после него уже в памяти ffmpeg. */

    const br = /,\s*(\d+)\s*kb\/s/.exec(v[0]);
    if (br) out.videoKbps = +br[1];

   по картинке на странице нельзя, она масштабирована по ширине карточки.

   разных объекта), «всего» тогда сумма. Пересечения рамок не вычитаются:

    const r = {

      wPct: frameW ? w / frameW * 100 : 0,
      hPct: frameH ? h / frameH * 100 : 0,
      areaPct: area ? w * h / area * 100 : 0

    sumH += h;
    sumArea += r.areaPct;

  if (b > 1 && b < 5) return forms[1];

<script>
/* ============================================================================
   Объединение таблиц (порт merge.py, но без привязки к трём колонкам адресов).

   merge.py умел ровно одно: склеить файлы вида «Название / Широта / Долгота»,
   взяв шапку из первого и дальше копируя строки по позициям. Здесь то же, но
   столбцы по умолчанию сопоставляются ПО НАЗВАНИЮ — тогда файл с другим
   порядком колонок не превратится в кашу.

   ========================================================================== */
(function (root) {
'use strict';

const L = root.OmniLib;

/* Колонки с координатами показываем с шестью знаками — как в merge.py. */
const COORD_RE = /(широт|долгот|\blat\b|\blon\b|\blng\b|latitude|longitude)/i;

/* Ключ для сравнения строк. NUL как разделитель: в данных его быть не может,
   поэтому «а|б» и «а», «б» не дадут один и тот же ключ. */
const KEY_SEP = String.fromCharCode(0);

const DEFAULTS = {
  matchBy: 'name',          // 'name' | 'position'
  addSource: false,         // добавить столбец с именем файла
  dedupe: false,            // убрать полные дубли строк
  emptyPlaceholder: true,   // пустое первое поле → 'empty' (поведение merge.py)
  sheetName: 'Объединено'
};

function cellStr(v) {
  return v === null || v === undefined ? '' : String(v).trim();
}

function rowIsEmpty(row) {
  for (const v of row) if (v !== null && v !== undefined && String(v).trim() !== '') return false;
  return true;
}

/* Шапка — первая непустая строка листа; дальше данные. */
function splitHeader(rows) {
  let i = 0;
  while (i < rows.length && rowIsEmpty(rows[i] || [])) i++;
  if (i >= rows.length) return { header: [], data: [] };
  const header = (rows[i] || []).map(cellStr);

    data.push(row);

/* Читает файлы → [{name, header, data, sheetName, error}]. Берём первый лист,

async function readTables(files, onProgress) {
  const out = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (onProgress) onProgress(i, files.length, f.name);
    try {
      const wb = await L.readXlsx(L.blobSource(f));
      if (!wb.sheets.length) throw new Error('в файле нет листов');
      const sheet = wb.sheets[0];
      const split = splitHeader(sheet.rows);
      out.push({
        name: f.name,
        sheetName: sheet.name,
        sheetCount: wb.sheets.length,
        header: split.header,
        data: split.data

    } catch (e) {
      out.push({ name: f.name, error: e.message, header: [], data: [] });
    }

  if (onProgress) onProgress(files.length, files.length, '');
  return out;

/* Склейка. tables — из readTables (или собранные вручную: {name, header, data}). */
function mergeTables(tables, options) {
  const opt = Object.assign({}, DEFAULTS, options || {});
  const good = tables.filter(function (t) { return !t.error; });
  const warnings = [];

  for (const t of tables) {
    if (t.error) warnings.push('«' + t.name + '»: не прочитался — ' + t.error);
    else if (t.sheetCount > 1) {
      warnings.push('«' + t.name + '»: листов ' + t.sheetCount +
                    ', взят первый («' + t.sheetName + '»)');
    }
  }
  if (!good.length) {
    return { header: [], rows: [], perFile: [], warnings: warnings,
             duplicateRows: 0, removed: 0, columnsAdded: [] };

  // ── итоговый набор столбцов ──

  const columnsAdded = [];

    header = good[0].header.slice();
    const seen = new Set(header.map(function (h) { return h.toLowerCase(); }));
    for (const t of good.slice(1)) {
      for (const h of t.header) {
        if (!h) continue;
        const k = h.toLowerCase();
        if (!seen.has(k)) {
          seen.add(k);

    let width = 0;
    for (const t of good) {

      for (const r of t.data) width = Math.max(width, r.length);

  const indexByName = new Map();
  header.forEach(function (h, i) { if (h) indexByName.set(h.toLowerCase(), i); });

  // случайно попал прошлый результат склейки (в исходном merge.py такой файл
  // молча удваивал таблицу).
  const seenRows = new Set();
  let duplicateRows = 0;
  let removed = 0;

  for (const t of good) {
    // как столбцы файла ложатся в итоговые
    let map;
    if (opt.matchBy === 'name') {
      map = t.header.map(function (h) {
        const i = h ? indexByName.get(h.toLowerCase()) : undefined;
        return i === undefined ? -1 : i;
      });
    } else {
      map = header.map(function (_, i) { return i; });
    }

    let added = 0;
    for (const src of t.data) {
      const row = new Array(header.length).fill('');
      if (opt.matchBy === 'name') {
        for (let c = 0; c < src.length; c++) {
          const to = c < map.length ? map[c] : -1;
          if (to >= 0) row[to] = src[c] === undefined ? '' : src[c];
        }
      } else {
        for (let c = 0; c < src.length && c < row.length; c++) {
          row[c] = src[c] === undefined ? '' : src[c];
        }
      }

      // поведение merge.py: первое поле пустое, а остальные нет → 'empty'
      if (opt.emptyPlaceholder && cellStr(row[0]) === '') {
        let hasRest = false;
        for (let c = 1; c < row.length; c++) if (cellStr(row[c]) !== '') { hasRest = true; break; }
        if (hasRest) row[0] = 'empty';
      }

      const key = row.map(cellStr).join(KEY_SEP);
      const isDupe = seenRows.has(key);
      if (isDupe) duplicateRows++;
      else seenRows.add(key);
      if (isDupe && opt.dedupe) { removed++; continue; }

      rows.push({ values: row, source: t.name });
      added++;
    }
    perFile.push({ name: t.name, rows: added, columns: t.header.length });
  }

  return {
    header: header,
    rows: rows,
    perFile: perFile,
    warnings: warnings,
    duplicateRows: duplicateRows,
    removed: removed,
    columnsAdded: columnsAdded,
    options: opt

/* Готовит лист для writeXlsx. */
function buildReport(merged, options) {
  const opt = Object.assign({}, DEFAULTS, merged.options || {}, options || {});
  const header = merged.header.slice();
  if (opt.addSource) header.push('Файл-источник');

  const coordCols = new Set();
  header.forEach(function (h, i) { if (COORD_RE.test(h)) coordCols.add(i); });

  const rows = [header];
  for (const r of merged.rows) {
    const values = r.values.slice();
    if (opt.addSource) values.push(r.source);
    rows.push(values.map(function (v, i) {
      if (coordCols.has(i) && typeof v === 'number') return { v: v, s: L.S.NUM6 };
      return v;
    }));
  }

  const cols = header.map(function (h, i) {
    if (coordCols.has(i)) return 14;
    return i === 0 ? 70 : 22;
  });

  return [{ name: String(opt.sheetName || 'Объединено').slice(0, 31), cols: cols, rows: rows }];

  DEFAULTS: DEFAULTS,
  readTables: readTables,
  mergeTables: mergeTables,
  buildReport: buildReport,

<script>
/* ============================================================================

   В отличие от ТТ/креативов/объединения этот инструмент не строит новый файл

   столбец, не трогая остальное. Обычное readXlsx/writeXlsx из omnilib для
   этого не годится: readXlsx читает только значения (без стилей, merge,

  const wb = await L.readXlsx(L.blobSource(file));
  if (!wb.sheets.length) throw new Error('в файле-источнике нет листов');
  const sheet = wb.sheets[0];
  const header = (sheet.rows[0] || []).map(function (v) { return L.cellStr(v).toLowerCase(); });
  const gidIdx = header.indexOf(opt.gidField.toLowerCase());
  const azIdx = header.indexOf(opt.azimuthField.toLowerCase());
